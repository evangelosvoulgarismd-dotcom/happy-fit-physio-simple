ηση φορτίου."], "pain": [["ok", "Ήπια ενόχληση. Συνήθως μπορείς να συνεχίσεις προσεκτικά."], ["ok", "Ήπια ενόχληση. Συνήθως μπορείς να συνεχίσεις προσεκτικά."], ["ok", "Ήπια ενόχληση. Συνήθως μπορείς να συνεχίσεις προσεκτικά."], ["ok", "Ήπια ενόχληση. Συνήθως μπορείς να συνεχίσεις προσεκτικά."], ["warn", "Μείωσε το φορτίο ή το εύρος κίνησης και παρακολούθησε."], ["bad", "Σταμάτα αυτή την άσκηση."], ["bad", "Σταμάτα αυτή την άσκηση."], ["bad", "Σταμάτα την προπόνηση. Έντονος πόνος χρειάζεται αξιολόγηση από επαγγελματία υγείας πριν συνεχίσεις."], ["bad", "Σταμάτα την προπόνηση. Έντονος πόνος χρειάζεται αξιολόγηση από επαγγελματία υγείας πριν συνεχίσεις."], ["bad", "Σταμάτα την προπόνηση. Έντονος πόνος χρειάζεται αξιολόγηση από επαγγελματία υγείας πριν συνεχίσεις."], ["bad", "Σταμάτα την προπόνηση. Έντονος πόνος χρειάζεται αξιολόγηση από επαγγελματία υγείας πριν συνεχίσεις."]], "flags": ["Έντονος ή επιδεινούμενος πόνος", "Νέος τραυματισμός", "Νέο σημαντικό σύμπτωμα", "Νευρολογικά συμπτώματα (π.χ. μούδιασμα, αδυναμία)", "Επείγον ιατρικό συμβάν"], "flagStop": "Σταμάτα την προπόνηση και ζήτα αξιολόγηση από αδειούχο γιατρό ή φυσικοθεραπευτή. Ένα πρόγραμμα δεν είναι το σωστό βήμα τώρα.", "flagEmg": "Κάλεσε το 166 ή το 112 τώρα.", "sleep": [["bad", "Πολύ λίγος ύπνος. Μείωσε προσωρινά τον όγκο προπόνησης και δώσε προτεραιότητα στον ύπνο."], ["warn", "Λίγο κάτω από τη σύσταση των 7+ ωρών. Δοκίμασε να πηγαίνεις νωρίτερα για ύπνο και μην ανεβάζεις φορτίο αυτή την εβδομάδα."], ["ok", "Είσαι εντός της σύστασης για ενήλικες (7+ ώρες)."]], "plan": {"none": "Διάλεξε τουλάχιστον μία ημέρα.", "one": "Ξεκίνα με 2 ημέρες αν μπορείς, ώστε να χτίσεις συνήθεια και να έχεις ενδυνάμωση 2 φορές την εβδομάδα.", "good": "Καλό ξεκίνημα. Κράτησε 30-40 λεπτά ανά προπόνηση.", "many": "Αν είσαι αρχάριος, ξεκίνα με 2-3 ημέρες και πρόσθεσε αργότερα. Η συνέπεια μετράει περισσότερο από τον αριθμό.", "cons": " Προσπάθησε να μην έχεις έντονες προπονήσεις σε διαδοχικές ημέρες στην αρχή."}, "titles": ["Ξεκίνα πιο ελαφριά και αύξανε σταδιακά", "Πόνος και ενόχληση: τι ξέρουμε και τι όχι", "Πότε σταματάς και ζητάς αξιολόγηση", "Μυϊκή ευαισθησία ή κάτι άλλο;", "Ύπνος και ανάκαμψη", "Γιατί μετράει η ενδυνάμωση", "Συνέπεια, βήματα και συνήθεια", "Μύθος ή γεγονός;"], "mins": [4, 4, 2, 3, 2, 3, 4, 3], "html": ["<p>Πολλοί τραυματισμοί υπερφόρτωσης σχετίζονται με απότομη αύξηση του φόρτου. Αντίστοιχα, η σταδιακά αυξανόμενη προπόνηση χτίζει αντοχή που προστατεύει <a class=\"cite\" href=\"#ref-4\">[4]</a>. Η λύση είναι απλή: αλλάζεις <strong>ένα πράγμα τη φορά</strong>.</p>\n<ul><li>Αύξησε είτε το βάρος, είτε τις επαναλήψεις, είτε τις ημέρες προπόνησης. Όχι όλα μαζί.</li><li>Για αρχάριους οι οδηγίες του ACSM προτείνουν 2-3 ημέρες την εβδομάδα και φορτίο που επιτρέπει περίπου 8-12 επαναλήψεις <a class=\"cite\" href=\"#ref-6\">[6]</a>.</li><li>Όταν μπορείς να κάνεις 1-2 επαναλήψεις πάνω από τον στόχο σου σε δύο συνεχόμενες προπονήσεις, αύξησε το βάρος κατά 2-10% <a class=\"cite\" href=\"#ref-6\">[6]</a>.</li><li>Αν μια εβδομάδα πήγε άσχημα, μείνε στο ίδιο φορτίο.</li></ul>\n<div class=\"tool\"><h4>Παράδειγμα 4 εβδομάδων</h4><table><tr><th>Εβδ.</th><th>Σετ × επαναλήψεις</th><th>Βάρος</th></tr>\n<tr><td>1</td><td>3 × 8</td><td>40 kg</td></tr><tr><td>2</td><td>3 × 10</td><td>40 kg</td></tr><tr><td>3</td><td>3 × 12</td><td>40 kg</td></tr><tr><td>4</td><td>3 × 8</td><td>42,5 kg (+6%)</td></tr></table>\n<p style=\"font-size:12px;color:var(--ink-soft);margin:6px 0 0;\">Πρώτα ανεβαίνουν οι επαναλήψεις, μετά το βάρος, και ξαναρχίζεις από λιγότερες. Είναι παράδειγμα, όχι πρόγραμμα για σένα.</p></div>\n<div class=\"tool\"><h4>Υπολογιστής RIR (επαναλήψεις στο απόθεμα)</h4>\n<p style=\"font-size:13px;color:var(--ink-soft);margin-bottom:8px;\">Το RIR λέει πόσες ακόμα επαναλήψεις θα μπορούσες να κάνεις πριν σταματήσεις. Υπάρχει κλίμακα που συνδέει την προσπάθεια με το RIR <a class=\"cite\" href=\"#ref-5\">[5]</a>.</p>\n<label>Στο τέλος του σετ θα μπορούσα να κάνω ακόμα: <strong id=\"rirV\">3</strong> επαναλήψεις</label><input type=\"range\" min=\"0\" max=\"6\" value=\"3\" id=\"rirR\"><div class=\"out ok\" id=\"rirO\"></div></div>", "<p>Χρησιμοποίησε μια κλίμακα 0-10 για τον πόνο. Πρώτα η εντιμότητα για το τι ξέρουμε: σε ανασκόπηση για τον χρόνιο μυοσκελετικό πόνο, η επώδυνη και η ανώδυνη άσκηση είχαν παρόμοια αποτελέσματα στη λειτουργικότητα, με μικρό όφελος της επώδυνης στον πόνο βραχυπρόθεσμα και τεκμήρια χαμηλής έως μέτριας ποιότητας <a class=\"cite\" href=\"#ref-7\">[7]</a>. Σε τενοντοπάθεια Αχιλλείου, η συνέχιση δραστηριότητας με παρακολούθηση του πόνου δεν είχε χειρότερα αποτελέσματα από την ενεργητική ξεκούραση <a class=\"cite\" href=\"#ref-8\">[8]</a>.</p>\n<p>Δηλαδή: <strong>δεν χρειάζεται να πονάει έντονα για να ωφεληθείς</strong>. Οι μελέτες αυτές όμως αφορούν επαγγελματικά καθοδηγούμενα προγράμματα. Για τον απλό ασκούμενο, χωρίς επαγγελματία δίπλα του, χρησιμοποιώ έναν <strong>συντηρητικό πρακτικό κανόνα</strong>. Δεν προκύπτει από μελέτη, είναι δικό μου όριο ασφάλειας. Δοκίμασέ τον:</p>\n<div class=\"tool\"><h4>Πόσο πονάει τώρα;</h4><input type=\"range\" min=\"0\" max=\"10\" value=\"2\" id=\"painR\"><div style=\"display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);\"><span>0</span><span class=\"big\" id=\"painV\" style=\"font-size:22px;color:var(--ink);\">2</span><span>10</span></div><div class=\"out ok\" id=\"painO\"></div></div>\n<p style=\"font-size:13px;color:var(--ink-soft);\">Αν η ενόχληση δεν έχει υποχωρήσει την επόμενη μέρα, κάν’ το πιο ελαφρύ την επόμενη φορά. Αν έχεις πόνο που επιμένει, το σωστό βήμα είναι η αξιολόγηση από επαγγελματία, όχι η αυτοδιαχείριση.</p>", "<p>Ορισμένα σημάδια χρησιμοποιούνται από επαγγελματίες υγείας ως «κόκκινες σημαίες», δηλαδή ένδειξη ότι χρειάζεται περαιτέρω έλεγχος. Από μόνα τους δεν αποτελούν διάγνωση και η διαγνωστική τους ακρίβεια είναι περιορισμένη, γι’ αυτό η απόφαση ανήκει σε επαγγελματία <a class=\"cite\" href=\"#ref-9\">[9]</a>. Τσέκαρε ό,τι ισχύει για σένα:</p>\n<div class=\"tool\"><h4>Έλεγχος σημάτων</h4><div id=\"flags\"></div><div class=\"out\" id=\"flagO\" style=\"display:none;\"></div></div>", "<p>Μετά από μια καινούρια ή έντονη προπόνηση είναι φυσιολογικό να νιώσεις μυϊκή επώδυνη ευαισθησία. Λέγεται καθυστερημένος μυϊκός πόνος (DOMS). Συνήθως εμφανίζεται κάποιες ώρες μετά, κορυφώνεται σε 1-3 ημέρες και υποχωρεί μέσα σε περίπου μία εβδομάδα <a class=\"cite\" href=\"#ref-10\">[10]</a>.</p>\n<div class=\"tool\"><h4>Πώς διαφέρει από κάτι που ανησυχεί</h4><table><tr><th></th><th>Μυϊκή ευαισθησία (DOMS)</th><th>Ανησυχητικό</th></tr>\n<tr><td>Πότε</td><td>Ώρες μετά, κορυφή σε 1-3 ημέρες</td><td>Απότομα, κατά τη διάρκεια της άσκησης</td></tr>\n<tr><td>Πού</td><td>Στους μυς που δούλεψαν, συνήθως και στις δύο πλευρές</td><td>Σε άρθρωση, τένοντα ή μία συγκεκριμένη θέση</td></tr>\n<tr><td>Πορεία</td><td>Βελτιώνεται από μέρα σε μέρα</td><td>Χειροτερεύει ή δεν υποχωρεί</td></tr>\n<tr><td>Άλλα σημάδια</td><td>Βαριά, δύσκαμπτα πόδια ή χέρια</td><td>Πρήξιμο, μελανιά, «κρακ», μούδιασμα, αδυναμία</td></tr></table></div>\n<ul><li>Η ήπια κίνηση και μια πιο ελαφριά επόμενη προπόνηση συνήθως αρκούν.</li><li>Αν υπάρχει κάτι από τη δεξιά στήλη, πήγαινε στο μάθημα 3 και ζήτα αξιολόγηση.</li></ul>", "<p>Η βελτίωση γίνεται στην ανάκαμψη, όχι μόνο στην προπόνηση. Η κοινή σύσταση των επιστημονικών εταιρειών ύπνου για ενήλικες είναι <strong>7 ή περισσότερες ώρες τη νύχτα</strong> για βέλτιστη υγεία <a class=\"cite\" href=\"#ref-2\">[2]</a>.</p>\n<div class=\"tool\"><h4>Πόσες ώρες κοιμάσαι συνήθως;</h4><input type=\"range\" min=\"3\" max=\"10\" step=\"0.5\" value=\"7\" id=\"slR\"><div style=\"text-align:center;\"><span class=\"big\" id=\"slV\">7</span> <span style=\"color:var(--ink-soft);\">ώρες</span></div><div class=\"out ok\" id=\"slO\"></div></div>\n<ul><li>Άφησε τουλάχιστον 1-2 ημέρες την εβδομάδα χωρίς έντονη προπόνηση. Το περπάτημα και η ήπια κίνηση βοηθούν.</li><li>Αν για αρκετές μέρες κοιμάσαι λίγο και νιώθεις εξαντλημένος/η, μείωσε προσωρινά τον όγκο και μην ανεβάζεις φορτίο.</li></ul>", "<p>Σε μετα-ανάλυση τυχαιοποιημένων μελετών για την πρόληψη τραυματισμών στον αθλητισμό, η ενδυνάμωση μείωσε τους αθλητικούς τραυματισμούς σε λιγότερο από το 1/3 (σχετικός κίνδυνος 0,31) και οι παρεμβάσεις συνολικά μείωσαν τους τραυματισμούς υπερφόρτωσης περίπου στο μισό (0,53). Το stretching μόνο του δεν έδειξε ουσιαστικό όφελος (0,96) <a class=\"cite\" href=\"#ref-3\">[3]</a>.</p>\n<div class=\"tool\"><h4>Τι δείχνουν οι αριθμοί</h4><table><tr><th>Παρέμβαση</th><th>Σχετικός κίνδυνος τραυματισμών</th></tr><tr><td>Ενδυνάμωση</td><td>0,31 (περίπου -69%)</td></tr><tr><td>Τραυματισμοί υπερφόρτωσης (όλες οι παρεμβάσεις)</td><td>0,53 (περίπου -47%)</td></tr><tr><td>Stretching</td><td>0,96 (χωρίς ουσιαστική διαφορά)</td></tr></table>\n<p style=\"font-size:12px;color:var(--ink-soft);margin:6px 0 0;\">Τα δεδομένα αφορούν κυρίως αθλητές και λίγες μελέτες για την ενδυνάμωση. Δείχνουν κατεύθυνση, όχι εγγύηση για τον καθένα.</p></div>\n<ul><li>Η ενδυνάμωση δεν είναι μόνο για «μυς». Είναι και προστασία των αρθρώσεων.</li><li>Δεν σημαίνει ότι το stretching είναι κακό. Απλώς δεν αρκεί ως μοναδική στρατηγική πρόληψης.</li></ul>", "<p>Οι οδηγίες του Παγκόσμιου Οργανισμού Υγείας για ενήλικες περιλαμβάνουν 150-300 λεπτά μέτριας αερόβιας δραστηριότητας την εβδομάδα και ενδυνάμωση μυών τουλάχιστον 2 ημέρες την εβδομάδα <a class=\"cite\" href=\"#ref-1\">[1]</a>. Φτιάξε το δικό σου πρώτο πλάνο:</p>\n<div class=\"tool\"><h4>Ποιες ημέρες θα προπονείσαι;</h4><div class=\"days\" id=\"days\"></div><div class=\"out\" id=\"planO\" style=\"display:none;\"></div></div>\n<p><strong>Και τα βήματα;</strong> Σε μετα-ανάλυση 15 ομάδων, περισσότερα καθημερινά βήματα συνδέονταν με χαμηλότερη θνησιμότητα. Το όφελος ανέβαινε μέχρι περίπου 6.000-8.000 βήματα για ηλικίες 60+ και 8.000-10.000 για νεότερους. Πρόκειται για παρατηρησιακά δεδομένα, όχι για απόδειξη αιτίας <a class=\"cite\" href=\"#ref-11\">[11]</a>.</p>\n<p><strong>Και η συνήθεια;</strong> Στη μελέτη των Lally και συνεργατών, ο διάμεσος χρόνος για να γίνει μια συμπεριφορά αυτόματη ήταν 66 ημέρες στην υποομάδα που αναλύθηκε, με εύρος 18 έως 254 ημέρες. Η άσκηση χρειαζόταν συνήθως περισσότερο από άλλες συμπεριφορές, αν και η διαφορά δεν ήταν στατιστικά σημαντική <a class=\"cite\" href=\"#ref-12\">[12]</a>. Μην περιμένεις να γίνει εύκολη σε 3 εβδομάδες.</p>\n<ul><li>Κλείσε ώρες στο ημερολόγιο, σαν ραντεβού.</li><li>Σημείωνε μετά από κάθε προπόνηση: βάρος, επαναλήψεις, πόνο. Σε 4 εβδομάδες θα βλέπεις πρόοδο στα νούμερα.</li></ul>", "<p>Πες για κάθε πρόταση αν είναι μύθος ή γεγονός και δες την εξήγηση με την πηγή της.</p><div id=\"myths\"></div>"], "myths": [["Πρέπει να πονάει έντονα για να δουλέψει η άσκηση.", "myth", "Μύθος. Στον χρόνιο μυοσκελετικό πόνο η επώδυνη και η ανώδυνη άσκηση είχαν παρόμοια αποτελέσματα στη λειτουργικότητα. Υπήρχε μικρό όφελος της επώδυνης στον πόνο μόνο βραχυπρόθεσμα, με τεκμήρια χαμηλής έως μέτριας ποιότητας.", 7], ["Το stretching αρκεί για να προλάβω τραυματισμούς.", "myth", "Μύθος. Στη μετα-ανάλυση το stretching μόνο του δεν έδειξε ουσιαστική μείωση τραυματισμών, ενώ η ενδυνάμωση έδειξε μεγάλη.", 3], ["Αν πονάω, πρέπει πάντα να σταματάω εντελώς κάθε δραστηριότητα ή να κάνω αυτοδιάγνωση.", "myth", "Μύθος. Σε ορισμένες περιπτώσεις, με καθοδήγηση επαγγελματία, η προσαρμοσμένη δραστηριότητα είναι ασφαλής (π.χ. τενοντοπάθεια Αχιλλείου). Γι’ αυτό το σωστό βήμα είναι η αξιολόγηση από επαγγελματία, όχι η αυτοδιάγνωση.", 8], ["Χρειάζομαι 10.000 βήματα, αλλιώς δεν έχει νόημα.", "myth", "Μύθος. Στη μετα-ανάλυση το όφελος εμφανιζόταν ήδη με πολύ λιγότερα βήματα και το πλατό ήταν περίπου στις 6.000-8.000 (60+) ή 8.000-10.000 (νεότεροι).", 11], ["Δεν υπάρχει «μαγικός αριθμός» ημερών για να γίνει η άσκηση συνήθεια.", "fact", "Γεγονός. Στη μελέτη του 2010 η διάμεσος ήταν 66 ημέρες, με εύρος 18-254, και ο αριθμός αφορούσε υποομάδα.", 12]], "quiz": [["Ποιο ισχύει για τη σταδιακή αύξηση του φόρτου;", ["Αλλάζω βάρος, επαναλήψεις και ημέρες ταυτόχρονα", "Αλλάζω ένα πράγμα τη φορά", "Ανεβάζω βάρος σε κάθε προπόνηση"], 1, "Η αλλαγή ενός πράγματος τη φορά κρατά την αύξηση σταδιακή και ελέγξιμη."], ["Έχεις πόνο 6/10 σε ένα σετ. Τι κάνεις με τον κανόνα του mini-course;", ["Συνεχίζω κανονικά", "Σταματάω αυτή την άσκηση", "Ανεβάζω βάρος για να το περάσω"], 1, "Από 5/10 και πάνω σε ένα σετ σταματάς την άσκηση (συντηρητικός πρακτικός κανόνας)."], ["Νιώθεις νέο μούδιασμα και αδυναμία στο πόδι. Τι είναι το σωστό βήμα;", ["Ζεσταίνομαι και προπονούμαι κανονικά", "Ζητώ αξιολόγηση από επαγγελματία υγείας", "Κάνω περισσότερο stretching"], 1, "Τα νευρολογικά συμπτώματα είναι σημάδι για αξιολόγηση από επαγγελματία."], ["Τι έδειξε η μετα-ανάλυση για τους τραυματισμούς στον αθλητισμό;", ["Η ενδυνάμωση συνδεόταν με σημαντική μείωση τραυματισμών", "Το stretching μόνο ήταν ο πιο αποτελεσματικός τρόπος", "Καμία παρέμβαση δεν είχε σχέση με τραυματισμούς"], 0, "Η ενδυνάμωση μείωσε τους τραυματισμούς σε λιγότερο από το 1/3 (RR 0,31)."], ["Πόσος χρόνος χρειάζεται για να γίνει μια συμπεριφορά συνήθεια;", ["Πάντα 21 ημέρες", "Δεν υπάρχει μαγικός αριθμός, στη μελέτη 18-254 ημέρες", "Μία εβδομάδα"], 1, "Στη μελέτη των Lally και συν. η διάμεσος ήταν 66 ημέρες με μεγάλο εύρος."]], "sheet": {"t": "Φυλλάδιο: ασφαλές ξεκίνημα στην άσκηση", "rules": [["Αύξηση φόρτου", "Άλλαζε ένα πράγμα τη φορά (βάρος, επαναλήψεις ή ημέρες). Αρχάριοι: 2-3 ημέρες την εβδομάδα, στόχος RIR 2-3. Ανέβασε το βάρος 2-10% όταν κάνεις 1-2 επαναλήψεις πάνω από τον στόχο σε δύο συνεχόμενες προπονήσεις."], ["Κανόνας πόνου 0-10 (συντηρητικός πρακτικός κανόνας)", "0-3 συνεχίζεις προσεκτικά. 4 μείωσε φορτίο ή εύρος. 5 και πάνω σε σετ: σταμάτα την άσκηση. 7 και πάνω: σταμάτα την προπόνηση και ζήτα αξιολόγηση. Δεν χρειάζεται έντονος πόνος για να ωφεληθείς."], ["Σταμάτα και ζήτα αξιολόγηση όταν υπάρχει", "Έντονος ή επιδεινούμενος πόνος, νέος τραυματισμός, νέο σημαντικό σύμπτωμα, νευρολογικά συμπτώματα (μούδιασμα, αδυναμία). Επείγον: 166 ή 112."], ["Μυϊκή ευαισθησία (DOMS)", "Ώρες μετά, κορυφή σε 1-3 ημέρες, βελτιώνεται καθημερινά. Αν είναι απότομο, σε άρθρωση ή χειροτερεύει, ζήτα αξιολόγηση."], ["Ανάκαμψη", "7 ή περισσότερες ώρες ύπνου. 1-2 ημέρες την εβδομάδα χωρίς έντονη προπόνηση."], ["Συνέπεια", "150-300 λεπτά μέτριας αερόβιας δραστηριότητας και ενδυνάμωση 2+ ημέρες την εβδομάδα (ΠΟΥ). Ξεκίνα με 2 προπονήσεις των 30-40 λεπτών και σημείωνε βάρος, επαναλήψεις και πόνο."]], "foot": "Γενική εκπαιδευτική πληροφορία, όχι ιατρική συμβουλή. Happy Fit Physio · evangelosvoulgarismd-dotcom.github.io/happy-fit-physio-simple"}},
    en: {"label": "Free mini-course", "h1": "A safe start to training", "sub": "8 short lessons with interactive tools, a quiz and references, to start or restart training with good judgement and consistency.", "p1": "8 lessons + quiz", "p2": "About 25 minutes", "p3": "12 references", "notice": "General educational information. It is not medical advice, a diagnosis or an individual program, and does not replace assessment by a licensed health professional.", "name": "Full name", "consent": "Optional: I agree to receive informational emails from Happy Fit Physio. I can unsubscribe anytime. Access to the mini-course does not depend on this.", "go": "View the mini-course", "sending": "Sending…", "bad": "Please check your name and email.", "progress": "Progress", "of": "of", "min": "min", "markDone": "Mark as done ✓", "undo": "Done ✓ (tap to undo)", "myth": "Myth", "fact": "Fact", "quizT": "Quiz", "quizP": "5 questions to check what stuck.", "score": "Score", "refT": "References", "retry": "Retry", "finalT": "End of the mini-course", "finalP": "You have the basics for a safe start. Download the cheat sheet with the rules and, if you want a program built for you, see the options.", "print": "Print / save as PDF", "plans": "See coaching options", "refNote": "References are for those who want to read the sources. Study conclusions do not automatically apply to every individual.", "days": ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"], "rir": ["Very close to failure. For beginners usually harder than needed.", "Very close to failure. For beginners usually harder than needed.", "Quite demanding. Fine on a few sets, not all of them.", "A good range to start with (RIR 2-3).", "A good range to start with (RIR 2-3).", "Probably too light. If this happens on all sets, consider a small load increase.", "Probably too light. If this happens on all sets, consider a small load increase."], "pain": [["ok", "Mild discomfort. You can usually continue carefully."], ["ok", "Mild discomfort. You can usually continue carefully."], ["ok", "Mild discomfort. You can usually continue carefully."], ["ok", "Mild discomfort. You can usually continue carefully."], ["warn", "Reduce the load or range of motion and monitor."], ["bad", "Stop this exercise."], ["bad", "Stop this exercise."], ["bad", "Stop the session. Severe pain needs assessment by a health professional before you continue."], ["bad", "Stop the session. Severe pain needs assessment by a health professional before you continue."], ["bad", "Stop the session. Severe pain needs assessment by a health professional before you continue."], ["bad", "Stop the session. Severe pain needs assessment by a health professional before you continue."]], "flags": ["Severe or worsening pain", "A new injury", "A new significant symptom", "Neurological symptoms (e.g. numbness, weakness)", "A medical emergency"], "flagStop": "Stop training and get assessed by a licensed doctor or physiotherapist. A program is not the right step now.", "flagEmg": "Call 166 or 112 now.", "sleep": [["bad", "Very little sleep. Temporarily reduce training volume and prioritise sleep."], ["warn", "Slightly under the 7+ hours recommendation. Try going to bed earlier and do not increase load this week."], ["ok", "You are within the adult recommendation (7+ hours)."]], "plan": {"none": "Pick at least one day.", "one": "Start with 2 days if you can, to build the habit and get strengthening twice a week.", "good": "A good start. Keep sessions to 30-40 minutes.", "many": "If you are a beginner, start with 2-3 days and add later. Consistency matters more than the number.", "cons": " Try not to have hard sessions on consecutive days at first."}, "titles": ["Start lighter and progress gradually", "Pain and discomfort: what we know and what we do not", "When to stop and get assessed", "Muscle soreness or something else?", "Sleep and recovery", "Why strength training matters", "Consistency, steps and habit", "Myth or fact?"], "mins": [4, 4, 2, 3, 2, 3, 4, 3], "html": ["<p>Many overuse injuries are linked to a sudden jump in load. Conversely, gradually progressed training builds resilience that protects <a class=\"cite\" href=\"#ref-4\">[4]</a>. The fix is simple: change <strong>one thing at a time</strong>.</p>\n<ul><li>Increase either weight, reps or training days. Not all at once.</li><li>For beginners, ACSM guidance suggests 2-3 days a week and a load allowing about 8-12 repetitions <a class=\"cite\" href=\"#ref-6\">[6]</a>.</li><li>When you can do 1-2 reps over your target in two consecutive sessions, raise the weight by 2-10% <a class=\"cite\" href=\"#ref-6\">[6]</a>.</li><li>If a week went badly, stay at the same load.</li></ul>\n<div class=\"tool\"><h4>4-week example</h4><table><tr><th>Wk</th><th>Sets × reps</th><th>Weight</th></tr>\n<tr><td>1</td><td>3 × 8</td><td>40 kg</td></tr><tr><td>2</td><td>3 × 10</td><td>40 kg</td></tr><tr><td>3</td><td>3 × 12</td><td>40 kg</td></tr><tr><td>4</td><td>3 × 8</td><td>42.5 kg (+6%)</td></tr></table>\n<p style=\"font-size:12px;color:var(--ink-soft);margin:6px 0 0;\">Reps go up first, then weight, and you restart at fewer reps. It is an example, not a program for you.</p></div>\n<div class=\"tool\"><h4>RIR calculator (reps in reserve)</h4>\n<p style=\"font-size:13px;color:var(--ink-soft);margin-bottom:8px;\">RIR tells you how many more reps you could have done. A scale links effort to RIR <a class=\"cite\" href=\"#ref-5\">[5]</a>.</p>\n<label>At the end of the set I could do: <strong id=\"rirV\">3</strong> more reps</label><input type=\"range\" min=\"0\" max=\"6\" value=\"3\" id=\"rirR\"><div class=\"out ok\" id=\"rirO\"></div></div>", "<p>Use a 0-10 pain scale. First, honesty about what is known: in a review of chronic musculoskeletal pain, painful and non-painful exercise had similar results for function, with a small short-term pain benefit for painful exercise and low-to-moderate quality evidence <a class=\"cite\" href=\"#ref-7\">[7]</a>. In Achilles tendinopathy, continuing activity with pain monitoring was not worse than active rest <a class=\"cite\" href=\"#ref-8\">[8]</a>.</p>\n<p>So: <strong>you do not need severe pain to benefit</strong>. But these studies involve professionally guided programs. For an everyday exerciser with no professional beside them I use a <strong>conservative practical rule</strong>. It does not come from a study, it is my own safety margin. Try it:</p>\n<div class=\"tool\"><h4>How much does it hurt now?</h4><input type=\"range\" min=\"0\" max=\"10\" value=\"2\" id=\"painR\"><div style=\"display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);\"><span>0</span><span class=\"big\" id=\"painV\" style=\"font-size:22px;color:var(--ink);\">2</span><span>10</span></div><div class=\"out ok\" id=\"painO\"></div></div>\n<p style=\"font-size:13px;color:var(--ink-soft);\">If discomfort has not settled the next day, go lighter next time. If pain persists, the right step is assessment by a professional, not self-management.</p>", "<p>Some signs are used by health professionals as \"red flags\", meaning a cue for further assessment. On their own they are not a diagnosis and their diagnostic accuracy is limited, so the decision belongs to a professional <a class=\"cite\" href=\"#ref-9\">[9]</a>. Tick what applies to you:</p>\n<div class=\"tool\"><h4>Warning signs check</h4><div id=\"flags\"></div><div class=\"out\" id=\"flagO\" style=\"display:none;\"></div></div>", "<p>After a new or hard session it is normal to feel muscle tenderness. It is called delayed onset muscle soreness (DOMS). It usually appears some hours later, peaks within 1-3 days and settles within about a week <a class=\"cite\" href=\"#ref-10\">[10]</a>.</p>\n<div class=\"tool\"><h4>How it differs from something concerning</h4><table><tr><th></th><th>Muscle soreness (DOMS)</th><th>Concerning</th></tr>\n<tr><td>When</td><td>Hours later, peak at 1-3 days</td><td>Suddenly, during the exercise</td></tr>\n<tr><td>Where</td><td>In the muscles worked, usually both sides</td><td>In a joint, tendon or one specific spot</td></tr>\n<tr><td>Course</td><td>Gets better day by day</td><td>Gets worse or does not settle</td></tr>\n<tr><td>Other signs</td><td>Heavy, stiff legs or arms</td><td>Swelling, bruising, a \"pop\", numbness, weakness</td></tr></table></div>\n<ul><li>Easy movement and a lighter next session are usually enough.</li><li>If anything in the right column applies, go to lesson 3 and get assessed.</li></ul>", "<p>Improvement happens in recovery, not only in training. The joint consensus of the sleep societies for adults is <strong>7 or more hours a night</strong> for optimal health <a class=\"cite\" href=\"#ref-2\">[2]</a>.</p>\n<div class=\"tool\"><h4>How many hours do you usually sleep?</h4><input type=\"range\" min=\"3\" max=\"10\" step=\"0.5\" value=\"7\" id=\"slR\"><div style=\"text-align:center;\"><span class=\"big\" id=\"slV\">7</span> <span style=\"color:var(--ink-soft);\">hours</span></div><div class=\"out ok\" id=\"slO\"></div></div>\n<ul><li>Keep at least 1-2 days a week without hard training. Walking and easy movement help.</li><li>If you sleep little for several days and feel drained, temporarily reduce volume and do not raise load.</li></ul>", "<p>In a meta-analysis of randomised trials on preventing sports injuries, strength training reduced sports injuries to less than 1/3 (relative risk 0.31) and the interventions overall reduced overuse injuries by about half (0.53). Stretching alone showed no meaningful benefit (0.96) <a class=\"cite\" href=\"#ref-3\">[3]</a>.</p>\n<div class=\"tool\"><h4>What the numbers show</h4><table><tr><th>Intervention</th><th>Relative risk of injury</th></tr><tr><td>Strength training</td><td>0.31 (about -69%)</td></tr><tr><td>Overuse injuries (all interventions)</td><td>0.53 (about -47%)</td></tr><tr><td>Stretching</td><td>0.96 (no meaningful difference)</td></tr></table>\n<p style=\"font-size:12px;color:var(--ink-soft);margin:6px 0 0;\">The data mostly concern athletes and few studies for strength training. It shows direction, not a guarantee for everyone.</p></div>\n<ul><li>Strength training is not only for \"muscles\". It also protects joints.</li><li>It does not mean stretching is bad. It is just not enough as the only prevention strategy.</li></ul>", "<p>The World Health Organization guidelines for adults include 150-300 minutes of moderate aerobic activity per week and muscle strengthening at least 2 days a week <a class=\"cite\" href=\"#ref-1\">[1]</a>. Build your own first plan:</p>\n<div class=\"tool\"><h4>Which days will you train?</h4><div class=\"days\" id=\"days\"></div><div class=\"out\" id=\"planO\" style=\"display:none;\"></div></div>\n<p><strong>What about steps?</strong> In a meta-analysis of 15 cohorts, more daily steps were linked with lower mortality. The benefit rose up to roughly 6,000-8,000 steps for ages 60+ and 8,000-10,000 for younger adults. These are observational data, not proof of cause <a class=\"cite\" href=\"#ref-11\">[11]</a>.</p>\n<p><strong>What about habit?</strong> In Lally and colleagues' study the median time for a behaviour to become automatic was 66 days in the analysed subgroup, with a range of 18 to 254 days. Exercise usually took longer than other behaviours, although the difference was not statistically significant <a class=\"cite\" href=\"#ref-12\">[12]</a>. Do not expect it to feel easy in 3 weeks.</p>\n<ul><li>Book your sessions in the calendar like appointments.</li><li>After each session note weight, reps and pain. In 4 weeks you will see progress in the numbers.</li></ul>", "<p>For each statement choose myth or fact and see the explanation with its source.</p><div id=\"myths\"></div>"], "myths": [["Exercise must hurt a lot to work.", "myth", "Myth. In chronic musculoskeletal pain, painful and non-painful exercise had similar functional outcomes. There was a small short-term pain benefit for painful exercise, with low-to-moderate quality evidence.", 7], ["Stretching is enough to prevent injuries.", "myth", "Myth. In the meta-analysis stretching alone showed no meaningful reduction in injuries, while strength training showed a large one.", 3], ["If I have pain I must always stop all activity completely or self-diagnose.", "myth", "Myth. In some cases, with professional guidance, adapted activity is safe (e.g. Achilles tendinopathy). That is why the right step is assessment by a professional, not self-diagnosis.", 8], ["I need 10,000 steps or it is pointless.", "myth", "Myth. In the meta-analysis the benefit appeared at much lower step counts and plateaued around 6,000-8,000 (60+) or 8,000-10,000 (younger).", 11], ["There is no \"magic number\" of days for exercise to become a habit.", "fact", "Fact. In the 2010 study the median was 66 days, range 18-254, and the figure applied to a subgroup.", 12]], "quiz": [["Which is true about gradually increasing load?", ["I change weight, reps and days all at once", "I change one thing at a time", "I raise weight every session"], 1, "Changing one thing at a time keeps progression gradual and controllable."], ["You have 6/10 pain in a set. What do you do under the mini-course rule?", ["Carry on as normal", "Stop that exercise", "Raise the weight to push through"], 1, "At 5/10 or more in a set you stop the exercise (a conservative practical rule)."], ["You notice new numbness and weakness in your leg. What is the right step?", ["Warm up and train as normal", "Get assessed by a health professional", "Do more stretching"], 1, "Neurological symptoms are a cue for assessment by a professional."], ["What did the meta-analysis show about sports injuries?", ["Strength training was linked with a large reduction in injuries", "Stretching alone was the most effective way", "No intervention was related to injuries"], 0, "Strength training reduced injuries to less than 1/3 (RR 0.31)."], ["How long does it take for a behaviour to become a habit?", ["Always 21 days", "There is no magic number, 18-254 days in the study", "One week"], 1, "In Lally et al. the median was 66 days with a wide range."]], "sheet": {"t": "Cheat sheet: a safe start to training", "rules": [["Progressing load", "Change one thing at a time (weight, reps or days). Beginners: 2-3 days a week, target RIR 2-3. Raise weight 2-10% when you do 1-2 reps over target in two consecutive sessions."], ["0-10 pain rule (conservative practical rule)", "0-3 continue carefully. 4 reduce load or range. 5 or more in a set: stop that exercise. 7 or more: stop the session and get assessed. You do not need severe pain to benefit."], ["Stop and get assessed when there is", "Severe or worsening pain, a new injury, a new significant symptom, neurological symptoms (numbness, weakness). Emergency: 166 or 112."], ["Muscle soreness (DOMS)", "Hours later, peak at 1-3 days, improves daily. If sudden, in a joint or getting worse, get assessed."], ["Recovery", "7 or more hours of sleep. 1-2 days a week without hard training."], ["Consistency", "150-300 minutes of moderate aerobic activity and strength training 2+ days a week (WHO). Start with 2 sessions of 30-40 minutes and note weight, reps and pain."]], "foot": "General educational information, not medical advice. Happy Fit Physio · evangelosvoulgarismd-dotcom.github.io/happy-fit-physio-simple"}} };
    const REFS = [["Bull FC, Al-Ansari SS, Biddle S, et al. World Health Organization 2020 guidelines on physical activity and sedentary behaviour. Br J Sports Med. 2020;54:1451-1462.", "https://doi.org/10.1136/bjsports-2020-102955"], ["Watson NF, Badr MS, Belenky G, et al. Recommended amount of sleep for a healthy adult: a joint consensus statement of the American Academy of Sleep Medicine and Sleep Research Society. J Clin Sleep Med. 2015;11(6):591-592.", "https://www.aasm.org/resources/pdf/adultsleepdurationconsensus.pdf"], ["Lauersen JB, Bertelsen DM, Andersen LB. The effectiveness of exercise interventions to prevent sports injuries: a systematic review and meta-analysis of randomised controlled trials. Br J Sports Med. 2014;48(11):871-877.", "https://doi.org/10.1136/bjsports-2013-092538"], ["Gabbett TJ. The training-injury prevention paradox: should athletes be training smarter and harder? Br J Sports Med. 2016;50(5):273-280.", "https://bjsm.bmj.com/content/50/5/273"], ["Zourdos MC, Klemp A, Dolan C, et al. Novel resistance training-specific rating of perceived exertion scale measuring repetitions in reserve. J Strength Cond Res. 2016;30(1):267-275.", "https://doi.org/10.1519/JSC.0000000000001049"], ["Ratamess NA, Alvar BA, Evetoch TK, et al. American College of Sports Medicine position stand. Progression models in resistance training for healthy adults. Med Sci Sports Exerc. 2009;41(3):687-708.", "https://pubmed.ncbi.nlm.nih.gov/?term=Progression+models+in+resistance+training+for+healthy+adults+ACSM+position+stand"], ["Smith BE, Hendrick P, Smith TO, et al. Should exercises be painful in the management of chronic musculoskeletal pain? A systematic review and meta-analysis. Br J Sports Med. 2017;51(23):1679-1687.", "https://doi.org/10.1136/bjsports-2016-097383"], ["Silbernagel KG, Thomee R, Eriksson BI, Karlsson J. Continued sports activity, using a pain-monitoring model, during rehabilitation in patients with Achilles tendinopathy: a randomized controlled study. Am J Sports Med. 2007;35(6):897-906.", "https://search.pedro.org.au/search-results/record-detail/18389"], ["Finucane LM, Downie A, Mercer C, et al. International framework for red flags for potential serious spinal pathologies. J Orthop Sports Phys Ther. 2020;50(7):350-372.", "https://doi.org/10.2519/jospt.2020.9971"], ["Cheung K, Hume P, Maxwell L. Delayed onset muscle soreness: treatment strategies and performance factors. Sports Med. 2003;33(2):145-164.", "https://pubmed.ncbi.nlm.nih.gov/12617692/"], ["Paluch AE, Bajpai S, Bassett DR, et al. Daily steps and all-cause mortality: a meta-analysis of 15 international cohorts. Lancet Public Health. 2022;7(3):e219-e228.", "https://doi.org/10.1016/S2468-2667(21)00302-9"], ["Lally P, van Jaarsveld CHM, Potts HWW, Wardle J. How are habits formed: modelling habit formation in the real world. Eur J Soc Psychol. 2010;40(6):998-1009.", "https://doi.org/10.1002/ejsp.674"]];

      if(i===0){
        const r=$('rirR'), v=$('rirV'), o=$('rirO');
        const up=()=>{ const n=+r.value; v.textContent=n; o.className='out '+(n<=1?'warn':n<=3?'ok':'warn'); o.textContent=T.rir[n]; };
        r.addEventListener('input',up); up();
      }
      if(i===1){
        const r=$('painR'), v=$('painV'), o=$('painO');
        const up=()=>{ const n=+r.value; v.textContent=n; const [c,txt]=T.pain[n]; o.className='out '+c; o.textContent=txt; };
        r.addEventListener('input',up); up();
      }
      if(i===2){
        const box=$('flags'), o=$('flagO');
        box.innerHTML = T.flags.map((f,k)=>`<label class="check"><input type="checkbox" data-i="${k}"><span>${esc(f)}</span></label>`).join('');
        const up=()=>{
          const on=[...box.querySelectorAll('input')].map(x=>x.checked);
          if(!on.some(Boolean)){ o.style.display='none'; return; }
          o.style.display='block'; o.className='out bad';
          if(on[4]) o.innerHTML='<strong>'+esc(T.flagEmg)+'</strong> '+esc(T.flagStop); else o.textContent=T.flagStop;
        };
        box.addEventListener('change',up);
      }
      if(i===4){
        const r=$('slR'), v=$('slV'), o=$('slO');
        const up=()=>{ const h=+r.value; v.textContent=String(h).replace('.',lang==='el'?',':'.'); const k=h<6?0:h<7?1:2; o.className='out '+T.sleep[k][0]; o.textContent=T.sleep[k][1]; };
        r.addEventListener('input',up); up();
      }
      if(i===6){
        const box=$('days'), o=$('planO');
        box.innerHTML = T.days.map((d,k)=>`<button type="button" class="day ${daysSel.has(k)?'on':''}" data-i="${k}">${esc(d)}</button>`).join('');
        const up=()=>{
          const n=daysSel.size; o.style.display='block';
          let txt, cls='ok';
          if(n===0){ txt=T.plan.none; cls=''; }
          else if(n===1){ txt=T.plan.one; cls='warn'; }
          else if(n<=3){ txt=T.plan.good; }
          else { txt=T.plan.many; cls='warn'; }
          const arr=[...daysSel].sort((a,b)=>a-b);
          if(n>=2 && arr.some((d,k)=>k>0 && d-arr[k-1]===1)) txt+=T.plan.cons;
          o.className='out '+cls; o.textContent=txt;
        };
        box.addEventListener('click',e=>{
          const b=e.target.closest('.day'); if(!b) return; const k=+b.dataset.i;
          if(daysSel.has(k)) daysSel.delete(k); else daysSel.add(k);
          b.classList.toggle('on'); LS.set('hfp_mc_days',JSON.stringify([...daysSel])); up();
        });
        up();
      }
      if(i===7){
        const box=$('myths');
        box.innerHTML = T.myths.map((m,k)=>`<div class="myth" data-k="${k}"><p class="mq">${esc(m[0])}</p><div class="mbtns"><button type="button" class="btn ghost" data-a="myth">${esc(T.myth)}</button><button type="button" class="btn ghost" data-a="fact">${esc(T.fact)}</button></div><div class="out" style="display:none;"></div></div>`).join('');
        box.addEventListener('click',e=>{
          const b=e.target.closest('button[data-a]'); if(!b) return;
          const card=b.closest('.myth'), m=T.myths[+card.dataset.k], right=b.dataset.a===m[1];
          const o=card.querySelector('.out'); o.style.display='block'; o.className='out '+(right?'ok':'warn');
          o.innerHTML=`<strong>${right?'✓':'✗'}</strong> ${esc(m[2])} <a class="cite" href="#ref-${m[3]}">[${m[3]}]</a>`;
        });
      }
    }
    function updateProgress(){
      const T=S[lang], n=done.size;
      $('pTxt').textContent = `${T.progress}: ${n} ${T.of} ${N}`; $('pBar').style.width = (n/N*100)+'%';
      for(let i=0;i<N;i++){
        const d=$('d_'+i); d.classList.toggle('done', done.has(i));
        const b=d.querySelector('.done-btn'); b.textContent = done.has(i)? T.undo : T.markDone; b.className = 'btn done-btn '+(done.has(i)?'ghost':'');
        d.querySelector('.n').textContent = done.has(i) ? '✓' : String(i+1);
      }
      $('final').style.display = n===N ? 'block' : 'none';
    }
    function renderSheet(){
      const T=S[lang].sheet;
      $('sheet').innerHTML = `<h2>${esc(T.t)}</h2>` + T.rules.map(r=>`<h3>${esc(r[0])}</h3><p>${esc(r[1])}</p>`).join('') + `<p class="foot">${esc(T.foot)}</p>`;
    }
    function renderQuiz(){
      const T=S[lang];
      const box=$('quiz');
      box.innerHTML = T.quiz.map((q,k)=>`<div class="qq" data-k="${k}"><p class="mq">${k+1}. ${esc(q[0])}</p>${q[1].map((o,j)=>`<button type="button" class="opt" data-j="${j}">${esc(o)}</button>`).join('')}<div class="out" style="display:none;"></div></div>`).join('') + `<div class="out" id="qScore" style="display:none;"></div>`;
      quizAns = {};
      box.onclick=e=>{
        const b=e.target.closest('.opt'); if(!b) return;
        const card=b.closest('.qq'), k=+card.dataset.k; if(quizAns[k]!==undefined) return;
        const j=+b.dataset.j, q=T.quiz[k]; quizAns[k]=j;
        card.querySelectorAll('.opt').forEach((x,idx)=>{ x.disabled=true; if(idx===q[2]) x.classList.add('right'); else if(idx===j) x.classList.add('wrong'); });
        const o=card.querySelector('.out'); o.style.display='block'; o.className='out '+(j===q[2]?'ok':'warn'); o.textContent=q[3];
        if(Object.keys(quizAns).length===T.quiz.length){
          const sc=T.quiz.filter((qq,i2)=>quizAns[i2]===qq[2]).length, s2=$('qScore');
          s2.style.display='block'; s2.className='out ok'; s2.innerHTML=`<strong>${esc(T.score)}: ${sc}/${T.quiz.length}</strong> <button type="button" class="btn ghost" id="qRetry" style="margin-left:8px;padding:6px 12px;">${esc(T.retry)}</button>`;
          $('qRetry').onclick=renderQuiz;
        }
      };
    }
    function renderContent(){
      const T = S[lang];
      $('content').dataset.open = '1';
      $('content').innerHTML = `<div class="prog"><div class="row"><span id="pTxt"></span></div><div class="bar"><i id="pBar"></i></div></div>`
        + T.html.map((h,i)=>`<details id="d_${i}" ${i===0?'open':''}><summary><span class="n">${i+1}</span><span class="t">${esc(T.titles[i])}</span><span class="min">${T.mins[i]} ${esc(T.min)}</span></summary><div class="body">${h}<button class="btn done-btn" type="button" data-k="${i}"></button></div></details>`).join('')
        + `<div class="card" style="margin-top:6px;"><h3 style="margin-bottom:4px;">${esc(T.quizT)}</h3><p class="sub" style="margin-bottom:12px;">${esc(T.quizP)}</p><div id="quiz"></div></div>`
        + `<div class="card final" id="final" style="display:none;"><h3>${esc(T.finalT)}</h3><p class="sub" style="margin:0;">${esc(T.finalP)}</p><div class="btns"><button class="btn" id="printBtn" type="button">${esc(T.print)}</button><a class="btn ghost" href="index.html#pricing">${esc(T.plans)}</a></div></div>`
        + `<h3 style="margin:26px 0 8px;">${esc(T.refT)}</h3><p class="src" style="margin-top:0;">${esc(T.refNote)}</p><ol class="refs">${REFS.map((r,i)=>`<li id="ref-${i+1}"><a href="${esc(r[1])}" target="_blank" rel="noopener noreferrer">${esc(r[0])}</a></li>`).join('')}</ol>`;
      $('content').style.display='block'; $('gate').style.display='none';
      for(let i=0;i<N;i++) wire(i);
      renderQuiz();
      document.querySelectorAll('.done-btn').forEach(b=>b.addEventListener('click',()=>{
        const k=+b.dataset.k; if(done.has(k)) done.delete(k); else { done.add(k); if(k+1<N){ $('d_'+k).open=false; $('d_'+(k+1)).open=true; $('d_'+(k+1)).scrollIntoView({behavior:'smooth',block:'start'}); } }
        LS.set('hfp_mc_done2',JSON.stringify([...done])); updateProgress();
      }));
      $('printBtn').addEventListener('click',()=>window.print());
      renderSheet(); updateProgress();
    }
    document.querySelectorAll('.langBtn').forEach(b=>b.addEventListener('click',()=>{ lang=b.dataset.lang; LS.set('hfp_lang',lang); paintStatic(); if($('content').dataset.open) renderContent(); }));
    $('f').addEventListener('submit', async ev=>{
      ev.preventDefault();
      const name=$('n').value.trim(), email=$('e').value.trim();
      const err=$('err'); err.style.display='none';
      if(!name || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ err.textContent=S[lang].bad; err.style.display='block'; return; }
      const btn=ev.submitter || document.querySelector('#f .btn'); btn.disabled=true; btn.textContent=S[lang].sending;
      if($('website').value.trim()===''){
        try{ await supabase.from('leads').insert({ full_name:name, email, interest:'Mini-course', marketing_consent:$('c').checked, source:'mini_course' }); }catch(e){ console.error(e); }
      }
      LS.set('hfp_minicourse','1'); renderContent();
    });
    paintStatic();
    if(LS.get('hfp_minicourse')==='1') renderContent();
  </script>
</body>
</html>
