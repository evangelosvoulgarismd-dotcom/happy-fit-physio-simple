<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Fit Physio — Coaching</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#241413; --ink-soft:#6b5450; --bg:#f6efe4; --panel:#fffdf9; --line:#e8dcc9;
    --red:#c4201f; --red-deep:#8f1615; --gold:#e2a233; --danger:#8f1615; --radius:4px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Public Sans',sans-serif; font-size:14px; line-height:1.5;}
  h1,h2,h3{font-family:'Poppins',sans-serif; font-weight:800; margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  #shell{display:flex; min-height:100vh;}
  #sidebar{width:230px; flex-shrink:0; background:var(--red-deep); color:#f7ece7; padding:22px 16px; display:flex; flex-direction:column; gap:16px;}
  #brandMark{display:flex; flex-direction:column; align-items:center; gap:8px; padding:4px 0 2px;}
  #brandMark svg{width:38px; height:38px;}
  #sidebar h1{font-size:15.5px; color:#fff; text-align:center; letter-spacing:0.01em;}
  #sidebarFooter{margin-top:auto; padding-top:12px; border-top:1px solid rgba(255,255,255,0.12); font-size:10.5px; color:#d99a92; text-align:center; line-height:1.6;}
  #sidebarFooter a{color:#f0d9d4; cursor:pointer; text-decoration:underline;}
  .modalOverlay{position:fixed; inset:0; background:rgba(36,20,19,0.55); display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px;}
  .modalBox{background:var(--panel); border-radius:10px; max-width:560px; width:100%; max-height:80vh; overflow-y:auto; padding:28px; box-shadow:0 20px 50px rgba(36,20,19,0.3);}
  .modalBox h2{margin-bottom:14px;}
  .modalBox p{font-size:13px; margin:0 0 10px; line-height:1.6;}
  .modalBox h4{font-size:13px; margin:16px 0 6px;}
  .modalCloseBtn{float:right; background:transparent; border:none; font-size:20px; cursor:pointer; color:var(--ink-soft); line-height:1;}
  .trustBadges{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-top:6px;}
  .trustBadges .badge{font-size:9.5px; padding:2px 7px;}
  .clinicalCard{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:22px 24px; margin-bottom:18px; box-shadow:0 1px 3px rgba(36,20,19,0.06);}
  .clinicalHeader{display:flex; align-items:center; gap:10px; padding-bottom:12px; border-bottom:2px solid var(--ink); margin-bottom:16px;}
  .clinicalHeader svg{width:26px; height:26px;}
  .clinicalHeader .brand{font-family:'Poppins',sans-serif; font-weight:800; font-size:13px; letter-spacing:0.04em; text-transform:uppercase; color:var(--ink);}
  .clinicalHeader .doc-title{font-family:'Poppins',sans-serif; font-weight:700; font-size:15px; margin-left:auto; color:var(--red-deep);}
  .clinicalSection{margin-bottom:22px;}
  .clinicalSection h4{font-family:'Poppins',sans-serif; font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:0.05em; color:var(--red-deep); border-bottom:1px solid var(--line); padding-bottom:6px; margin-bottom:12px;}
  .bodyDiagram{display:flex; gap:20px; justify-content:center; margin-bottom:14px; flex-wrap:wrap;}
  .bodyDiagram .bodyCol{text-align:center;}
  .bodyDiagram .bodyCol .lbl{font-size:10.5px; color:var(--ink-soft); margin-bottom:4px; text-transform:uppercase; letter-spacing:0.04em;}
  .bodyDiagram svg{width:100px; height:210px; cursor:crosshair; background:#fdfbf7; border:1px solid var(--line); border-radius:6px;}
  .bodyDiagram .clearMarkers{font-size:10.5px; color:var(--red-deep); cursor:pointer; text-decoration:underline; display:block; margin-top:4px;}
  .painMarker{fill:#c4201f; stroke:#fff; stroke-width:1;}
  .reassessTable{width:100%; border-collapse:collapse; font-size:12px;}
  .reassessTable th, .reassessTable td{border:1px solid var(--line); padding:6px 8px; text-align:center;}
  .reassessTable th{background:#efe4d4; font-weight:600; color:var(--ink-soft); font-size:10.5px; text-transform:uppercase;}
  #sidebar .tagline{font-size:11px; color:#f1c9c1; text-align:center; margin:2px 0 0;}
  .navBtn{background:transparent; border:none; color:#f0d9d4; text-align:left; padding:9px 10px; border-radius:var(--radius); cursor:pointer; font-size:13.5px; font-family:inherit; border-left:3px solid transparent;}
  .navBtn:hover{background:rgba(255,255,255,.08);}
  .navBtn.active{background:rgba(255,255,255,.12); border-left-color:var(--gold); color:#fff; font-weight:600;}
  .langToggle{display:flex; gap:6px;}
  .langToggle button{flex:1; padding:6px; border-radius:var(--radius); border:1px solid #a8302f; background:transparent; color:#f5ddd6; cursor:pointer; font-size:12px; font-family:inherit;}
  .langToggle button.active{background:var(--gold); color:var(--ink); border-color:var(--gold); font-weight:700;}
  #main{flex:1; padding:28px 40px 60px; max-width:980px;}
  .card{background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--red); border-radius:8px; padding:18px; margin-bottom:16px; box-shadow:0 1px 3px rgba(36,20,19,0.06); transition:box-shadow .15s ease;}
  .card.gold{border-left-color:var(--gold);}
  .clientCard{transition:box-shadow .15s ease, transform .1s ease;}
  .clientCard:hover{box-shadow:0 4px 14px rgba(36,20,19,0.12); transform:translateY(-1px);}
  .statGrid{display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:12px; margin-bottom:18px;}
  .statCard{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px 16px; box-shadow:0 1px 3px rgba(36,20,19,0.06);}
  .statCard .num{font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:600; color:var(--red-deep); line-height:1.1;}
  .statCard .lbl{font-size:11.5px; color:var(--ink-soft); margin-top:4px;}
  .chartWrap{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px 16px 8px; margin-bottom:14px; height:220px; box-shadow:0 1px 3px rgba(36,20,19,0.06);}
  .chartTitle{font-size:12px; color:var(--ink-soft); margin-bottom:6px; font-weight:600;}
  .btn{font-family:inherit; font-weight:600; font-size:13px; padding:9px 16px; border-radius:var(--radius); border:1px solid var(--red); background:var(--red); color:#fff; cursor:pointer;}
  .btn:hover{background:var(--red-deep); border-color:var(--red-deep);}
  .btn.secondary{background:transparent; color:var(--red); border-color:var(--red);}
  .btn.secondary:hover{background:#fbeae6;}
  .btn.danger{background:transparent; color:var(--danger); border-color:var(--danger);}
  .btn.danger:hover{background:#f6e0da;}
  .field{display:flex; flex-direction:column; gap:4px; margin-bottom:10px;}
  .field label{font-size:12px; color:var(--ink-soft);}
  .field input,.field select,.field textarea{font-family:inherit; font-size:13.5px; padding:8px 10px; border:1px solid var(--line); border-radius:var(--radius); background:#fff; color:var(--ink); width:100%;}
  .field textarea{min-height:56px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:0 16px;}
  .badge{display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px; background:#efe4d4; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}
  .savedTag{font-size:11.5px; color:var(--red);}
  .errorTag{font-size:12.5px; color:var(--danger); background:#f6e0da; padding:8px 10px; border-radius:var(--radius);}
  table.hist{width:100%; border-collapse:collapse; font-size:12.8px;}
  table.hist th,table.hist td{padding:8px 10px; border-bottom:1px solid var(--line); text-align:left;}
  table.hist th{background:#efe4d4; font-weight:600; color:var(--ink-soft); font-size:11.5px;}
  .authWrap{max-width:380px; margin:60px auto;}
  .authWrap .card{border-left-width:6px;}
  .roleToggle{display:flex; gap:8px; margin-bottom:14px;}
  .roleToggle button{flex:1; padding:10px; border-radius:var(--radius); border:1px solid var(--line); background:#fff; cursor:pointer; font-family:inherit; font-weight:600; font-size:12.5px;}
  .roleToggle button.active{background:var(--red); color:#fff; border-color:var(--red);}
  .evidenceItem{border-top:1px solid var(--line); padding:8px 0; font-size:12.8px;}
  .evidenceItem a{color:var(--red-deep);}
  .setRow{display:flex; gap:8px; align-items:center; margin-bottom:6px;}
  .setRow input{width:70px; padding:6px;}
  .clickable{cursor:pointer;}
  .tableScroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}

  /* ---------- Mobile ---------- */
  @media (max-width: 760px){
    #shell{flex-direction:column;}
    #sidebar{
      width:100%; flex-direction:row; flex-wrap:wrap; align-items:center; gap:8px;
      padding:12px 14px; position:sticky; top:0; z-index:100;
    }
    #brandMark{flex-direction:row; padding:0; gap:6px;}
    #brandMark svg{width:26px; height:26px;}
    #sidebar h1{font-size:13px; text-align:left;}
    #sidebar .tagline{display:none;}
    .langToggle{width:auto; order:2; margin-left:auto;}
    .langToggle button{padding:5px 8px;}
    .navBtn{padding:7px 10px; font-size:12.5px; border-left:none; border-bottom:3px solid transparent;}
    .navBtn.active{border-left:none; border-bottom-color:var(--gold);}
    #sidebar > div[style*="margin-top:auto"]{order:5; width:100%; flex-direction:row !important; flex-wrap:wrap; gap:6px !important; margin-top:4px !important;}
    #sidebarFooter{width:100%; order:6;}
    #main{padding:16px 14px 40px;}
    .grid2{grid-template-columns:1fr;}
    .authWrap{margin:24px auto; padding:0 12px;}
    .setRow{flex-wrap:wrap;}
    .setRow input{width:64px; flex:1; min-width:52px;}
    .bodyDiagram{gap:10px;}
    .bodyDiagram svg{width:80px; height:168px;}
    .statGrid{grid-template-columns:repeat(2,1fr);}
    table.hist, .reassessTable{font-size:11px;}
  }
</style>
</head>

function showLegalModal(key){
  const doc = LEGAL_CONTENT[key];
  if(!doc) return;
  const overlay = el(`<div class="modalOverlay"><div class="modalBox">
    <button class="modalCloseBtn" type="button">&times;</button>
    <h2>${doc.title[locale]||doc.title.el}</h2>
    ${doc.body[locale]||doc.body.el}
  </div></div>`);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('.modalCloseBtn').addEventListener('click', ()=>overlay.remove());
  overlay.querySelectorAll('[data-legal]').forEach(a=>a.addEventListener('click', (e)=>{ e.preventDefault(); overlay.remove(); showLegalModal(a.dataset.legal); }));
  document.body.appendChild(overlay);
}

    <p style="color:var(--ink-soft);font-size:12.5px;margin:0 0 18px;">${t('tagline',locale)}</p>
    <div class="roleToggle" id="modeToggle">
      <button data-m="login" class="active">${t('login',locale)}</button>
      <button data-m="signup">${t('signup',locale)}</button>
    </div>
    <div class="roleToggle" id="roleToggle" style="display:none;">
      <button data-r="coach" class="active">${t('iAmCoach',locale)}</button>
      <button data-r="client">${t('iAmClient',locale)}</button>
    </div>
    <form id="authForm">
      <div class="field" id="nameField" style="display:none;"><label>${t('fullName',locale)}</label><input id="fullName"></div>
      <div class="field"><label>${t('email',locale)}</label><input id="authEmail" type="email" required></div>
      <div class="field"><label>${t('password',locale)}</label><input id="authPassword" type="password" required minlength="6"></div>
      <div class="field" id="codeField" style="display:none;"><label>${t('inviteCode',locale)}</label><input id="inviteCode" placeholder="π.χ. A1B2C3D4"></div>
      <div class="field" id="consentField" style="display:none; flex-direction:row; align-items:flex-start; gap:8px;">
        <input type="checkbox" id="consentBox" style="width:auto; margin-top:3px;">
        <label style="margin:0; font-size:12px; line-height:1.5;">${locale==='el'
          ? `Συναινώ στην επεξεργασία των δεδομένων μου και αποδέχομαι τους <a data-legal="terms" style="color:var(--red-deep);">Όρους Χρήσης</a>, την <a data-legal="privacy" style="color:var(--red-deep);">Πολιτική Απορρήτου</a> και την <a data-legal="disclaimer" style="color:var(--red-deep);">Ιατρική Αποποίηση Ευθύνης</a>.`
          : `I consent to data processing and accept the <a data-legal="terms" style="color:var(--red-deep);">Terms of Use</a>, <a data-legal="privacy" style="color:var(--red-deep);">Privacy Policy</a>, and <a data-legal="disclaimer" style="color:var(--red-deep);">Medical Disclaimer</a>.`}</label>
      </div>
      <div id="authError"></div>
      <button class="btn" type="submit" style="width:100%; margin-top:6px;">${t('login',locale)}</button>
    </form>
    <div class="trustBadges" style="margin-top:16px;">
      <span class="badge">🔒 GDPR</span><span class="badge">🇪🇺 EU hosting</span><span class="badge">🩺 Physiotherapy-led</span>
    </div>
  </div></div>`);
  app.appendChild(wrap);
  wrap.querySelectorAll('[data-legal]').forEach(a=>a.addEventListener('click', (e)=>{ e.preventDefault(); showLegalModal(a.dataset.legal); }));

  function syncFields(){
    wrap.querySelector('#nameField').style.display = mode==='signup' ? '' : 'none';
    wrap.querySelector('#consentField').style.display = mode==='signup' ? '' : 'none';
    wrap.querySelector('#roleToggle').style.display = mode==='signup' ? 'flex' : 'none';
    wrap.querySelector('#codeField').style.display = (mode==='signup' && role==='client') ? '' : 'none';
    wrap.querySelector('button[type=submit]').textContent = mode==='login' ? t('login',locale) : t('signup',locale);
  }
  wrap.querySelectorAll('#modeToggle button').forEach(b=>b.addEventListener('click', ()=>{
    mode = b.dataset.m;
    wrap.querySelectorAll('#modeToggle button').forEach(x=>x.classList.toggle('active', x===b));
    syncFields();
  }));
  wrap.querySelectorAll('#roleToggle button').forEach(b=>b.addEventListener('click', ()=>{
    role = b.dataset.r;
    wrap.querySelectorAll('#roleToggle button').forEach(x=>x.classList.toggle('active', x===b));
    syncFields();
  }));

  wrap.querySelector('#authForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const errBox = wrap.querySelector('#authError');
    errBox.innerHTML = '';
    const email = wrap.querySelector('#authEmail').value.trim();
    const password = wrap.querySelector('#authPassword').value;
    try{
      if(mode==='login'){
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if(error) throw error;
      } else {
        const fullName = wrap.querySelector('#fullName').value.trim();
        const consent = wrap.querySelector('#consentBox').checked;
        if(!fullName) throw new Error(locale==='el' ? 'Βάλε το ονοματεπώνυμό σου.' : 'Enter your full name.');
        if(!consent) throw new Error(locale==='el' ? 'Χρειάζεται συναίνεση.' : 'Consent is required.');

        if(role==='client'){
          const code = wrap.querySelector('#inviteCode').value.trim().toUpperCase();
          const { data: codeRow, error: codeErr } = await supabase.from('invite_codes').select('*').eq('code', code).eq('used', false).single();
          if(codeErr || !codeRow) throw new Error(locale==='el' ? 'Μη έγκυρος κωδικός πρόσκλησης.' : 'Invalid invite code.');
          const { data, error } = await supabase.auth.signUp({ email, password });
          if(error) throw error;
          const userId = data.user.id;
          await supabase.from('profiles').insert({ id:userId, role:'client', full_name:fullName, locale });
          await supabase.from('clients').insert({ id:userId, coach_id:codeRow.coach_id, full_name:fullName });
          await supabase.from('invite_codes').update({ used:true, used_by:userId }).eq('code', code);
          await supabase.from('consents').insert({ profile_id:userId, granted:true });
        } else {
          const { data, error } = await supabase.auth.signUp({ email, password });
          if(error) throw error;
          const userId = data.user.id;
          await supabase.from('profiles').insert({ id:userId, role:'coach', full_name:fullName, locale });
          await supabase.from('consents').insert({ profile_id:userId, granted:true });
        }
      }
      await boot();
    }catch(err){
      errBox.innerHTML = `<p class="errorTag">${escapeHtml(err.message || String(err))}</p>`;
    }
  });
  syncFields();
}

async function exportMyData(){
  const payload = { exportedAt:new Date().toISOString(), profile };
  if(profile.role==='client'){
    const [ck, rd, pr, lg] = await Promise.all([
      supabase.from('checkins').select('*').eq('client_id', profile.id),
      supabase.from('readiness_logs').select('*').eq('client_id', profile.id),
      supabase.from('programs').select('*, program_exercises(*, exercises(*))').eq('client_id', profile.id),
      supabase.from('session_logs').select('*').eq('client_id', profile.id),
    ]);
    payload.checkins = ck.data; payload.readiness = rd.data; payload.programs = pr.data; payload.session_logs = lg.data;
  }
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = el(`<a href="${url}" download="happy-fit-physio-data.json"></a>`);
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast(locale==='el' ? 'Λήψη έγινε' : 'Downloaded');
}

let evidenceAutoCache = {};
function youtubeEmbedUrl(url){
  if(!url) return null;
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{6,})/);
  return m ? `https://www.youtube.com/embed/${m[1]}` : null;
}
async function fetchEuropePMC(query){
  const url = `https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=${encodeURIComponent(query)}&format=json&pageSize=5&sort=P_PDATE_D%20desc`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('fetch failed');
  const data = await res.json();
  return (data.resultList?.result || []).map(r=>({
    title: r.title, authors: r.authorString, journal: r.journalTitle, year: r.pubYear,
    doi: r.doi || null, pmid: r.pmid || null,
    url: r.doi ? `https://doi.org/${r.doi}` : (r.pmid ? `https://pubmed.ncbi.nlm.nih.gov/${r.pmid}/` : null),
  }));
}

function renderAutoEvidenceBox(box, ex, fresh){
  if(!box) return;

    box.innerHTML = `<span>✓ ${locale==='el'?'Δεν βρέθηκε νεότερη βιβλιογραφία πέρα από αυτή που έχεις ήδη.':'No newer literature found beyond what you already have.'}</span>`;
    return;
  }
  box.innerHTML = `<div style="font-weight:600; margin-bottom:6px;">🔍 ${fresh.length} ${locale==='el'?'πιθανές νέες μελέτες:':'possible new studies:'}</div>`;
  fresh.forEach(r=>{
    const row = el(`<div class="evidenceItem">
      <div>${escapeHtml(r.authors||'')} — <em>${escapeHtml(r.title||'')}</em> (${escapeHtml(r.journal||'')}, ${r.year||''})</div>
      <button class="btn secondary addAutoEvBtn" style="margin-top:4px; padding:4px 10px; font-size:11.5px;" type="button">+ ${t('save',locale)}</button>
    </div>`);
    row.querySelector('.addAutoEvBtn').addEventListener('click', async ()=>{
      await supabase.from('evidence').insert({
        exercise_id: ex.id,
        citation: `${r.authors||''} ${r.title}. ${r.journal||''} ${r.year||''}.`.trim(),
        url: r.url, added_by: profile.id,
      });
      delete evidenceAutoCache[ex.id];
      toast(locale==='el' ? 'Προστέθηκε' : 'Added');
      row.remove();
    });
    box.appendChild(row);
  });
}

async function renderCoachDashboard(main){
  if(selectedClient){ return renderClientDetail(main); }
  main.innerHTML = `<p>${t('loading',locale)}</p>`;
  const [{ data: clients }, { data: invites }] = await Promise.all([
    supabase.from('clients').select('*').eq('coach_id', profile.id).order('created_at',{ascending:false}),
    supabase.from('invite_codes').select('*').eq('coach_id', profile.id).eq('used', false).order('created_at',{ascending:false}),
  ]);

  const clientIds = (clients||[]).map(c=>c.id);
  let latestCheckinByClient = {}, programByClient = {}, checkinsByClient = {}, readinessByClient = {};
  if(clientIds.length){
    const [{ data: allCheckins }, { data: allPrograms }, { data: allReadiness }] = await Promise.all([
      supabase.from('checkins').select('client_id,date,adherence,pain_level,avg_energy').in('client_id', clientIds).order('date',{ascending:false}),
      supabase.from('programs').select('client_id,title').in('client_id', clientIds).eq('active', true),
      supabase.from('readiness_logs').select('client_id,date,energy,motivation').in('client_id', clientIds).order('date',{ascending:false}),
    ]);
    (allCheckins||[]).forEach(c=>{
      if(!latestCheckinByClient[c.client_id]) latestCheckinByClient[c.client_id] = c;
      (checkinsByClient[c.client_id] = checkinsByClient[c.client_id]||[]).push(c);
    });
    (allPrograms||[]).forEach(p=>{ if(!programByClient[p.client_id]) programByClient[p.client_id] = p; });
    (allReadiness||[]).forEach(r=>{ (readinessByClient[r.client_id] = readinessByClient[r.client_id]||[]).push(r); });
  }

  function computeAlerts(client){
    const alerts = [];
    const cks = checkinsByClient[client.id] || [];
    const rds = readinessByClient[client.id] || [];
    const daysSince = (dateStr)=> (Date.now() - new Date(dateStr).getTime()) / (1000*60*60*24);

    if(cks.length===0 || daysSince(cks[0].date) > 10){
      alerts.push(t('alertNoCheckin',locale));
    }
    if(cks.length>=2 && cks[0].pain_level!=null && cks[1].pain_level!=null && cks[0].pain_level > cks[1].pain_level && cks[0].pain_level >= 4){
      alerts.push(t('alertPainRising',locale));
    }
    if(cks.length>=2 && cks[1].adherence!=null && cks[0].adherence!=null && (cks[1].adherence - cks[0].adherence) >= 20){
      alerts.push(t('alertAdherenceDrop',locale));
    }
    if(rds.length>=2){
      const recent = rds.slice(0,3);
      const avgEnergy = recent.reduce((s,r)=>s+(r.energy||0),0)/recent.length;
      const avgMotivation = recent.reduce((s,r)=>s+(r.motivation||0),0)/recent.length;
      if(avgEnergy < 4 || avgMotivation < 4) alerts.push(t('alertLowEnergy',locale));
    }
    return alerts;
  }

  main.innerHTML = '';
  main.appendChild(el(`<h2 style="margin-bottom:14px;">${t('clients',locale)}</h2>`));

  const alertsByClient = {};
  (clients||[]).forEach(c=>{ alertsByClient[c.id] = computeAlerts(c); });

  if(clients?.length){
    const panel = el(`<div class="card" style="border-left-color:${flaggedClients.length?'var(--danger)':'var(--red)'};">

    if(!flaggedClients.length){
      panel.appendChild(el(`<p style="font-size:12.5px; color:var(--ink-soft);">${t('noAlerts',locale)}</p>`));
    } else {
      flaggedClients.forEach(c=>{
        const row = el(`<div class="clickable" style="padding:6px 0; border-top:1px solid var(--line);">
          <strong style="font-size:13px;">${escapeHtml(c.full_name)}</strong>
          <div style="font-size:11.5px; color:var(--danger); margin-top:2px;">${alertsByClient[c.id].map(a=>`⚠ ${escapeHtml(a)}`).join(' · ')}</div>
        </div>`);
        row.addEventListener('click', ()=>{ selectedClient = c; renderClientDetail._tab='checkins'; renderShell(); });
        panel.appendChild(row);
      });
    }
    main.appendChild(panel);
  }

  if(clients?.length){
    const adherenceVals = Object.values(latestCheckinByClient).map(c=>c.adherence).filter(v=>v!=null);
    const avgAdherence = adherenceVals.length ? Math.round(adherenceVals.reduce((a,b)=>a+b,0)/adherenceVals.length) : null;
    const painCount = Object.values(latestCheckinByClient).filter(c=>c.pain_level>3).length;

    const mrr = activeClients.reduce((sum,c)=>sum+(Number(c.monthly_price)||0),0);
    const GOAL = 10000;
    const pct = Math.min(100, Math.round((mrr/GOAL)*100));

    const revenueBox = el(`<div class="card gold" style="margin-bottom:16px;">

      <div style="background:#efe4d4; border-radius:20px; height:8px; overflow:hidden;">

    </div>`);

  const codeMsg = el(`<p class="savedTag" style="display:none;"></p>`);
  main.appendChild(codeMsg);
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const name = form.querySelector('.newClientName').value.trim();
    if(!name) return;
    const code = uidCode();
    await supabase.from('invite_codes').insert({ code, coach_id: profile.id, client_name: name });
    try{ await navigator.clipboard.writeText(code); }catch(err){}
    codeMsg.style.display = '';
    codeMsg.innerHTML = `${locale==='el'?'Κωδικός πρόσκλησης (αντιγράφηκε ήδη)':'Invite code (already copied)'}: <span class="mono badge">${code}</span>`;

      row.querySelector('.cancelInviteBtn').addEventListener('click', async ()=>{
        await supabase.from('invite_codes').delete().eq('code', i.code);
        renderCoachDashboard(main);
      });
      box.appendChild(row);
    });
    main.appendChild(box);
  }

  if(!clients?.length){ main.appendChild(el(`<p>${t('noClients',locale)}</p>`)); return; }

  let activeSportFilter = renderCoachDashboard._sportFilter || '';

    const filterBar = el(`<div style="margin-bottom:12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;">

    const prog = programByClient[c.id];
    const painFlag = lastCk && lastCk.pain_level > 3;
    const status = c.status || 'trial';
    const statusColor = status==='active' ? 'var(--red-deep)' : (status==='paused' ? 'var(--gold)' : (status==='cancelled' ? 'var(--danger)' : 'var(--ink-soft)'));

      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
        <div class="clickable clientCardMain" style="flex:1; min-width:160px;">

            ${c.pathway ? `<span class="badge" style="color:var(--red-deep);">${escapeHtml(c.pathway)}</span>` : ''}

          <button class="btn secondary jumpBtn" data-jump="live" style="padding:6px 12px; font-size:12px;">${t('liveSession',locale)}</button>

    }));
    card.querySelector('.delClientBtn').addEventListener('click', async ()=>{
      if(!confirm(locale==='el' ? `Οριστική διαγραφή του/της ${c.full_name} και όλων των δεδομένων του (πρόγραμμα, check-ins, μηνύματα); Δεν αναιρείται.` : `Permanently delete ${c.full_name} and all their data (program, check-ins, messages)? This cannot be undone.`)) return;
      await supabase.from('clients').delete().eq('id', c.id);
      renderCoachDashboard(main);
    });
    main.appendChild(card);
  });
}

async function renderClientDetail(main){
  const client = selectedClient;
  let tab = renderClientDetail._tab || 'program';
  main.innerHTML = `<p>${t('loading',locale)}</p>`;
  const [{ data: programs }, { data: exercises }, { data: checkins }, { data: readiness }, { data: intakeRow }] = await Promise.all([
    supabase.from('programs').select('*, program_exercises(*, exercises(*))').eq('client_id', client.id).eq('active', true).order('created_at',{ascending:false}),
    supabase.from('exercises').select('*').order('category'),
    supabase.from('checkins').select('*').eq('client_id', client.id).order('date',{ascending:false}),
    supabase.from('readiness_logs').select('*').eq('client_id', client.id).order('date',{ascending:false}),
    supabase.from('client_intake').select('*').eq('client_id', client.id).maybeSingle(),
  ]);
  const program = programs?.[0] || null;

  main.innerHTML = '';
  const back = el(`<button class="btn secondary">← ${locale==='el'?'Πίσω':'Back'}</button>`);
  back.addEventListener('click', ()=>{ selectedClient=null; renderShell(); });
  main.appendChild(back);
  main.appendChild(el(`<h2 style="margin-top:14px;">${escapeHtml(client.full_name)}</h2>`));

  const tabs = el(`<div style="display:flex; gap:8px; margin:16px 0; flex-wrap:wrap;">
    <button class="btn ${tab==='intake'?'':'secondary'}" data-t="intake">${t('intake',locale)}</button>
    <button class="btn ${tab==='program'?'':'secondary'}" data-t="program">${t('program',locale)}</button>
    <button class="btn ${tab==='live'?'':'secondary'}" data-t="live">${t('liveSession',locale)}</button>
    <button class="btn ${tab==='messages'?'':'secondary'}" data-t="messages">${t('messages',locale)}</button>
    <button class="btn ${tab==='checkins'?'':'secondary'}" data-t="checkins">${t('checkins',locale)}</button>
    <button class="btn ${tab==='readiness'?'':'secondary'}" data-t="readiness">${t('readiness',locale)}</button>
    <button class="btn ${tab==='reassess'?'':'secondary'}" data-t="reassess">${t('reassessment',locale)}</button>
    <button class="btn ${tab==='business'?'':'secondary'}" data-t="business">${t('business',locale)}</button>
  </div>`);
  tabs.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>{ renderClientDetail._tab = b.dataset.t; renderClientDetail(main); }));
  main.appendChild(tabs);

  const body = el('<div></div>');
  main.appendChild(body);

  if(tab==='intake') renderIntakeForm(body, client, intakeRow?.data || null);
  else if(tab==='program') renderProgramTab(body, client, program, exercises, ()=>renderClientDetail(main), intakeRow?.data || null);
  else if(tab==='live'){
    if(program) await renderLiveSessionTab(body, client, program, true);
    else body.appendChild(el(`<p>${locale==='el'?'Δημιούργησε πρώτα πρόγραμμα.':'Create a program first.'}</p>`));
  }
  else if(tab==='messages') await renderMessagesTab(body, client, 'coach');
  else if(tab==='reassess') await renderReassessmentTab(body, client, true);
  else if(tab==='business') renderBusinessTab(body, client, ()=>renderClientDetail(main));
  else if(tab==='checkins'){
    renderCheckinForm(body, checkins, client.id);
    renderTrendChart(body, locale==='el'?'Adherence % & Ενέργεια ανά check-in':'Adherence % & Energy per check-in', checkins, 'date', [
      {key:'adherence', label:'Adherence %'}, {key:'avg_energy', label:locale==='el'?'Ενέργεια':'Energy'},
    ]);
    renderHistTable(body, checkins, ['date','sessions_completed','avg_sleep','avg_energy','pain_level','adherence']);
  }
  else if(tab==='readiness'){
    renderTrendChart(body, locale==='el'?'Readiness τάσεις':'Readiness trends', readiness, 'date', [
      {key:'sleep', label:locale==='el'?'Ύπνος':'Sleep'}, {key:'energy', label:locale==='el'?'Ενέργεια':'Energy'},
      {key:'stress', label:locale==='el'?'Στρες':'Stress'}, {key:'pain', label:locale==='el'?'Πόνος':'Pain'},
    ]);
    renderHistTable(body, readiness, ['date','sleep','energy','stress','pain','perceived_capacity']);
  }
}

function bodyOutlineSvg(view){
  // Simple, recognizable front/back silhouette — not anatomically precise, matches a clinical pain-marking diagram.
  return `<svg viewBox="0 0 100 210" data-view="${view}">
    <circle cx="50" cy="18" r="13"/>
    <path d="M50 31 C30 31 24 42 24 60 L24 95 C24 100 30 100 30 95 L32 62 L32 130 L26 205 L40 205 L48 120 L52 120 L60 205 L74 205 L68 130 L68 62 L70 95 C70 100 76 100 76 95 L76 60 C76 42 70 31 50 31 Z"/>
  </svg>`;
}

function renderBodyDiagram(container, state, onChange){
  const points = state.painPoints || [];
  const wrap = el(`<div class="bodyDiagram">
    <div class="bodyCol">
      <div class="lbl">${t('frontView',locale)}</div>
      <div class="svgHolder"></div>
      <span class="clearMarkers" data-view="front">${t('clearMarkers',locale)}</span>
    </div>
    <div class="bodyCol">
      <div class="lbl">${t('backView',locale)}</div>
      <div class="svgHolder"></div>
      <span class="clearMarkers" data-view="back">${t('clearMarkers',locale)}</span>
    </div>
  </div>
  <p style="font-size:10.5px; color:var(--ink-soft); text-align:center; margin:-6px 0 14px;">${t('clickToMark',locale)}</p>`);

  ['front','back'].forEach(view=>{
    const holder = wrap.querySelectorAll('.svgHolder')[view==='front'?0:1];
    const svgEl = el(bodyOutlineSvg(view));
    svgEl.style.fill = '#e8dcc9';
    svgEl.style.stroke = 'var(--ink-soft)';
    svgEl.style.strokeWidth = '1';

    function drawMarkers(){
      svgEl.querySelectorAll('.painMarker').forEach(m=>m.remove());
      points.filter(p=>p.view===view).forEach(p=>{
        const dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
        dot.setAttribute('cx', p.x); dot.setAttribute('cy', p.y); dot.setAttribute('r', '4');
        dot.setAttribute('class','painMarker');
        svgEl.appendChild(dot);
      });
    }
    drawMarkers();

    svgEl.addEventListener('click', (e)=>{
      const rect = svgEl.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width) * 100;
      const y = ((e.clientY - rect.top) / rect.height) * 210;
      points.push({ view, x: Math.round(x), y: Math.round(y) });
      state.painPoints = points;
      drawMarkers();
      onChange();
    });
    holder.appendChild(svgEl);
  });

  wrap.querySelectorAll('.clearMarkers').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.painPoints = points.filter(p=>p.view!==btn.dataset.view);
      container.querySelectorAll('svg').forEach(s=>{
        if(s.dataset.view===btn.dataset.view) s.querySelectorAll('.painMarker').forEach(m=>m.remove());
      });
      onChange();
    });
  });

  container.appendChild(wrap);
}

    }, 700);
  }

    const secEl = el(`<div class="clinicalSection"><h4>${t(section.title,locale)}</h4><div class="grid2 fieldsGrid"></div></div>`);
    const fieldsGrid = secEl.querySelector('.fieldsGrid');

    if(section.key==='pain'){
      renderBodyDiagram(secEl, state, scheduleSave);
    }

    section.fields.forEach(([key, type, opts])=>{
      let input;
      if(type==='select'){
        input = el(`<select><option value="">—</option>${opts.map(o=>`<option value="${escapeHtml(o)}" ${state[key]===o?'selected':''}>${escapeHtml(o)}</option>`).join('')}</select>`);
      } else if(type==='area'){
        input = el(`<textarea>${escapeHtml(state[key]||'')}</textarea>`);
      } else if(type==='date'){
        input = el(`<input type="date" value="${escapeHtml(state[key]||'')}">`);
      } else {
        input = el(`<input value="${escapeHtml(state[key]||'')}">`);
      }
      input.addEventListener(type==='select'?'change':'input', ()=>{
        state[key] = input.value;
        scheduleSave();
      });
      const fieldDiv = el(`<div class="field"><label>${t(key,locale)}</label></div>`);
      fieldDiv.appendChild(input);
      fieldsGrid.appendChild(fieldDiv);
    });
    sectionsWrap.appendChild(secEl);
  });

  body.appendChild(card);
}

async function renderReassessmentTab(body, client, isCoach){
  const { data: rows } = await supabase.from('reassessments').select('*').eq('client_id', client.id).order('session_number',{ascending:true});

  if(isCoach){
    const form = el(`<form class="card gold" style="display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end;">
      <div class="field" style="width:90px; margin-bottom:0;"><label>${t('sessionNumber',locale)}</label><input class="f_sn" type="number" value="${(rows?.length||0)+1}"></div>
      <div class="field" style="width:70px; margin-bottom:0;"><label>${t('pain',locale)}</label><input class="f_pain" type="number" min="0" max="10"></div>
      <div class="field" style="min-width:140px; margin-bottom:0;"><label>${t('otherSymptoms',locale)}</label><input class="f_other"></div>
      <div class="field" style="min-width:120px; margin-bottom:0;"><label>${t('passiveRom',locale)}</label><input class="f_prom"></div>
      <div class="field" style="min-width:120px; margin-bottom:0;"><label>${t('activeRom',locale)}</label><input class="f_arom"></div>
      <div class="field" style="min-width:120px; margin-bottom:0;"><label>${t('strength',locale)}</label><input class="f_str"></div>
      <button class="btn" type="submit">${t('addSession',locale)}</button>
    </form>`);
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      await supabase.from('reassessments').insert({
        client_id: client.id,
        session_number: Number(form.querySelector('.f_sn').value)||null,
        pain: Number(form.querySelector('.f_pain').value)||null,
        other_symptoms: form.querySelector('.f_other').value.trim(),
        passive_rom: form.querySelector('.f_prom').value.trim(),
        active_rom: form.querySelector('.f_arom').value.trim(),
        strength: form.querySelector('.f_str').value.trim(),
        created_by: profile.id,
      });
      body.innerHTML = '';
      await renderReassessmentTab(body, client, isCoach);
    });
    body.appendChild(form);
  }

  if(!rows?.length){
    body.appendChild(el(`<p>${t('noReassessments',locale)}</p>`));
    return;
  }
  const table = el(`<table class="reassessTable"><thead><tr>
    <th>${t('sessionNumber',locale)}</th><th>${t('pain',locale)}</th><th>${t('otherSymptoms',locale)}</th>
    <th>${t('passiveRom',locale)}</th><th>${t('activeRom',locale)}</th><th>${t('strength',locale)}</th>
  </tr></thead><tbody>
    ${rows.map(r=>`<tr>
      <td class="mono">${r.session_number??''}</td><td class="mono">${r.pain??''}</td><td>${escapeHtml(r.other_symptoms||'')}</td>
      <td>${escapeHtml(r.passive_rom||'')}</td><td>${escapeHtml(r.active_rom||'')}</td><td>${escapeHtml(r.strength||'')}</td>
    </tr>`).join('')}
  </tbody></table>`);
  body.appendChild(el('<div class="card tableScroll"></div>')).appendChild(table);
}



function renderReferFriendTab(body){
  const card = el(`<div class="card gold">
    <p style="font-size:13px; margin-bottom:12px;">${t('referFriendHint',locale)}</p>
    <button class="btn genCodeBtn" type="button">${t('generateCode',locale)}</button>
    <div class="codeResult" style="margin-top:12px;"></div>
  </div>`);
  card.querySelector('.genCodeBtn').addEventListener('click', async ()=>{
    const { data: clientRow } = await supabase.from('clients').select('coach_id').eq('id', profile.id).single();
    if(!clientRow) return;
    const code = uidCode();
    const { error } = await supabase.from('invite_codes').insert({ code, coach_id: clientRow.coach_id, client_name: `${locale==='el'?'Πρόταση από':'Referral from'} ${profile.full_name}` });
    const resultBox = card.querySelector('.codeResult');
    if(error){
      resultBox.innerHTML = `<p class="errorTag">${escapeHtml(error.message)}</p>`;
      return;
    }
    try{ await navigator.clipboard.writeText(code); }catch(err){}
    resultBox.innerHTML = `<span class="mono badge" style="font-size:16px; padding:6px 14px;">${code}</span> <span class="savedTag">${locale==='el'?'(αντιγράφηκε)':'(copied)'}</span>`;
  });
  body.appendChild(card);
}

let _chartInstances = [];
function destroyCharts(){ _chartInstances.forEach(c=>c.destroy()); _chartInstances = []; }

function renderTrendChart(container, title, rows, dateKey, series){
  // rows: array of objects sorted desc by date — we reverse for chronological display
  if(!rows?.length){ return; }
  const sorted = [...rows].sort((a,b)=> (a[dateKey]||'').localeCompare(b[dateKey]||''));
  const wrap = el(`<div class="chartWrap"><div class="chartTitle">${escapeHtml(title)}</div><canvas></canvas></div>`);
  container.appendChild(wrap);
  const ctx = wrap.querySelector('canvas');
  const palette = ['#c4201f','#241413','#e2a233','#6b5450'];
  const chart = new Chart(ctx, {
    type:'line',
    data:{
      labels: sorted.map(r=>r[dateKey]),
      datasets: series.map((s,i)=>({
        label: s.label,
        data: sorted.map(r=>r[s.key]),
        borderColor: palette[i%palette.length],
        backgroundColor: palette[i%palette.length],
        tension:0.25,
        spanGaps:true,
      })),
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      scales:{ y:{ beginAtZero:true, ticks:{font:{family:'IBM Plex Mono', size:10}} }, x:{ ticks:{font:{family:'IBM Plex Mono', size:9}} } },
      plugins:{ legend:{ labels:{ font:{family:'Public Sans', size:10.5}, boxWidth:12 } } },
    }
  });
  _chartInstances.push(chart);
}

const GOAL_CATEGORY_MAP = {
  'Μυϊκή ανάπτυξη': ['Δύναμη'],
  'Απώλεια λίπους': ['Δύναμη','Λειτουργική'],
  'Αύξηση δύναμης': ['Δύναμη'],
  'Βελτίωση φυσικής κατάστασης': ['Λειτουργική'],
  'Βελτίωση κινητικότητας': ['Κινητικότητα','Κορμός'],
  'Μείωση ενοχλήσεων': ['Πρόληψη τραυματισμού','Κορμός'],
  'Επιστροφή μετά τραυματισμό': ['Πρόληψη τραυματισμού'],
  'Αθλητική απόδοση': ['Λειτουργική','Δύναμη'],
};
const RISK_KEYWORDS = [
  { match:['γόνατ','knee'], nameHints:['squat','step-up','καθίσματα','step-up'] },
  { match:['ώμ','shoulder'], nameHints:['overhead press','pull-up','bench press','ώθηση ώμων'] },
  { match:['μέση','οσφ','low back','lower back'], nameHints:['deadlift','άρση θανάτου','overhead press'] },
  { match:['βουβων','προσαγωγ','groin','adductor'], nameHints:['copenhagen','step-up'] },
  { match:['μηριαί','hamstring'], nameHints:['romanian','nordic','deadlift','άρση θανάτου'] },
  { match:['καρπ','wrist'], nameHints:['bench press','plank','bird dog','πλανκ'] },
];

function computeRecommendations(intakeData, exercises){
  const recommended = new Set();
  const risky = new Map();
  if(!intakeData) return { recommended, risky };

  const goalCats = GOAL_CATEGORY_MAP[intakeData.mainGoal] || [];
  const riskText = [intakeData.currentPain, intakeData.injuryHistory, intakeData.fearedMovement]
    .filter(Boolean).join(' ').toLowerCase();

  exercises.forEach(ex=>{
    const cat = ex.category || '';
    if(goalCats.some(gc=>cat.includes(gc))) recommended.add(ex.id);

    const nameLower = (ex.name_el+' '+(ex.name_en||'')).toLowerCase();
    RISK_KEYWORDS.forEach(rk=>{
      if(rk.match.some(m=>riskText.includes(m)) && rk.nameHints.some(h=>nameLower.includes(h))){
        risky.set(ex.id, true);
      }
    });
  });
  return { recommended, risky };
}

async function renderLiveSessionTab(body, client, program, loggedByCoach){
  const today = new Date().toISOString().slice(0,10);
  const { data: todaysLogs } = await supabase.from('session_logs').select('*').eq('client_id', client.id).eq('session_date', today);
  const logMap = {};
  (todaysLogs||[]).forEach(l=>{ logMap[`${l.program_exercise_id}_${l.set_number}`] = l; });

  if(loggedByCoach){
    body.appendChild(el(`<div class="card gold" style="padding:12px 16px; display:flex; align-items:center; gap:8px;">
      <span style="font-size:16px;">🏋️</span><strong>${locale==='el'?'Καταγράφεις τη ζωντανή προπόνηση του/της':'You are logging the live session for'} ${escapeHtml(client.full_name)}</strong>
    </div>`));
  }
  body.appendChild(el(`<p class="badge">${today}</p>`));
  (program.program_exercises||[]).forEach(pe=>{
    const card = el(`<div class="card">
      <strong>${escapeHtml(locale==='el'?pe.exercises.name_el:(pe.exercises.name_en||pe.exercises.name_el))}</strong>
      <div class="mono" style="font-size:12px; color:var(--ink-soft); margin-bottom:10px;">${locale==='el'?'Στόχος':'Target'}: ${pe.target_sets} × ${escapeHtml(pe.target_reps||'')} @ ${escapeHtml(pe.target_load||'—')}</div>
    </div>`);
    const setsCount = pe.target_sets || 3;
    for(let s=1; s<=setsCount; s++){
      const existing = logMap[`${pe.id}_${s}`];
      let logId = existing?.id || null;
      const row = el(`<div class="setRow">
        <span class="mono" style="width:24px;">#${s}</span>
        <input class="f_reps" placeholder="${t('reps',locale)}" value="${existing?.reps ?? ''}">
        <input class="f_load" placeholder="${t('load',locale)}" value="${existing?.load_kg ?? ''}">
        <input class="f_rpe" placeholder="${t('rpe',locale)}" value="${existing?.rpe ?? ''}">
        <input class="f_pain" placeholder="${t('pain',locale)}" value="${existing?.pain ?? ''}">
        <button class="btn ${existing?'':'secondary'}" type="button" style="padding:6px 12px; font-size:12px;">${existing ? '✓ '+t('saved',locale).replace('✓ ','') : t('logSet',locale)}</button>
      </div>`);
      row.querySelector('button').addEventListener('click', async ()=>{
        const payload = {
          program_exercise_id: pe.id, client_id: client.id, logged_by: profile.id, session_date: today, set_number: s,
          reps: Number(row.querySelector('.f_reps').value)||null,
          load_kg: Number(row.querySelector('.f_load').value)||null,
          rpe: Number(row.querySelector('.f_rpe').value)||null,
          pain: Number(row.querySelector('.f_pain').value)||0,
        };
        const btn = row.querySelector('button');
        btn.textContent = '…';
        try{
          if(logId){
            const { error } = await supabase.from('session_logs').update(payload).eq('id', logId);
            if(error) throw error;
          } else {
            const { data, error } = await supabase.from('session_logs').insert(payload).select().single();
            if(error) throw error;
            logId = data.id;
          }
          btn.textContent = '✓ '+t('saved',locale).replace('✓ ','');
          btn.classList.remove('secondary');
          toast(t('saved',locale));
        }catch(err){
          btn.textContent = t('logSet',locale);
          toast(locale==='el' ? 'Σφάλμα αποθήκευσης' : 'Save error');
        }
      });
      card.appendChild(row);
    }
    body.appendChild(card);
  });
}

    card.appendChild(row);
  });
  card.appendChild(statusEl);
  body.appendChild(card);
}

function renderCheckinForm(body, existing, clientId){
  const today = new Date().toISOString().slice(0,10);
  let currentDate = today;
  const scales = [
    ['sessions_completed', {el:'Προπονήσεις', en:'Sessions'}, 0,14], ['avg_sleep', {el:'Ύπνος', en:'Sleep'}, 0,10],
    ['avg_stress', {el:'Στρες', en:'Stress'}, 0,10], ['avg_energy', {el:'Ενέργεια', en:'Energy'}, 0,10],
    ['avg_soreness', {el:'Πιάσιμο', en:'Soreness'}, 0,10], ['avg_motivation', {el:'Motivation', en:'Motivation'}, 0,10],
    ['pain_level', {el:'Πόνος', en:'Pain'}, 0,10], ['difficulty', {el:'Δυσκολία', en:'Difficulty'}, 0,10],
    ['adherence', {el:'Adherence %', en:'Adherence %'}, 0,100],
  ];
  const textLabels = {
    problem_exercise: {el:'Άσκηση που δημιούργησε πρόβλημα', en:'Exercise that caused a problem'},
    adherence_challenges: {el:'Τι δυσκόλεψε', en:'What was challenging'},
    what_worked: {el:'Τι λειτούργησε', en:'What worked'},
    feedback_changes: {el:'Τι θα άλλαζες την επόμενη εβδομάδα', en:'What would you change next week'},
    anything_else: {el:'Κάτι άλλο σημαντικό', en:'Anything else important'},
  };
  const texts = ['problem_exercise','adherence_challenges','what_worked','feedback_changes','anything_else'];

  const wrap = el('<div></div>');
  body.appendChild(wrap);

  function draw(){
    wrap.innerHTML = '';
    const existingForDate = existing.find(c=>c.date===currentDate) || {};
    const state = { sessions_completed:0, avg_sleep:6, avg_stress:5, avg_energy:6, avg_soreness:5, avg_motivation:6, pain_level:0, difficulty:5, adherence:80, problem_exercise:'', adherence_challenges:'', what_worked:'', feedback_changes:'', anything_else:'', ...existingForDate };
    let timer = null;
    const card = el(`<div class="card gold">
      <div class="field"><label>${locale==='el'?'Ημερομηνία':'Date'}</label><input type="date" class="dateInput" value="${currentDate}"></div>
      <div class="grid2 scalesGrid"></div>
      <div class="textsGrid"></div>
      <span class="savedTag statusSpan"></span>
    </div>`);
    const statusEl = card.querySelector('.statusSpan');
    card.querySelector('.dateInput').addEventListener('change', (e)=>{ currentDate = e.target.value; draw(); });

    const grid = card.querySelector('.scalesGrid');
    scales.forEach(([k,l,min,max])=>{
      const row = el(`<div class="field"><label>${l[locale]||l.el}: <span class="mono val">${state[k]}</span></label><input type="range" min="${min}" max="${max}" value="${state[k]}"></div>`);
      row.querySelector('input').addEventListener('input', (e)=>{
        state[k] = Number(e.target.value);
        row.querySelector('.val').textContent = state[k];
        scheduleSave();
      });
      grid.appendChild(row);
    });
    const textsGrid = card.querySelector('.textsGrid');
    texts.forEach(k=>{
      const lbl = textLabels[k]?.[locale] || textLabels[k]?.el || k.replace(/_/g,' ');
      const row = el(`<div class="field"><label>${lbl}</label><textarea>${escapeHtml(state[k])}</textarea></div>`);
      row.querySelector('textarea').addEventListener('input', (e)=>{ state[k]=e.target.value; scheduleSave(); });
      textsGrid.appendChild(row);
    });

    function scheduleSave(){
      statusEl.textContent = locale==='el' ? 'Πληκτρολόγηση…' : 'Typing…';
      clearTimeout(timer);
      timer = setTimeout(async ()=>{
        await supabase.from('checkins').upsert({ ...state, client_id: clientId, date: currentDate }, { onConflict:'client_id,date' });
        statusEl.textContent = t('saved',locale);
      }, 700);
    }

    wrap.appendChild(card);
  }
  draw();
}

// ============================================================
// BOOT
// ============================================================
async function boot(){
  const { data } = await supabase.auth.getSession();
  session = data.session;
  if(!session){ profile = null; renderAuth(); return; }
  const { data: p, error } = await supabase.from('profiles').select('*').eq('id', session.user.id).single();
  if(error || !p){ profile = null; renderAuth(); return; }
  profile = p; locale = p.locale || 'el';
  view = 'dashboard'; selectedClient = null;
  renderShell();
}

supabase.auth.onAuthStateChange((_evt, s)=>{ session = s; });
boot();
</script>
