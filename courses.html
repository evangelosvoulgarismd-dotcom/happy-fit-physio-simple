<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Τα Μαθήματά μου · Happy Fit Physio</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root{
    --ink:#f5f5f5; --ink-soft:#9a9a9a; --bg:#0b0b0b; --panel:#121212; --line:#242424; --red:#e50914;
  }
  *,*::before,*::after{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:'Public Sans',sans-serif; line-height:1.6; min-height:100vh;}
  .wrap{max-width:720px; margin:0 auto; padding:48px 20px 80px;}
  h1{font-family:'Poppins',sans-serif; font-size:26px; margin-bottom:6px;}
  .sub{color:var(--ink-soft); font-size:13.5px; margin-bottom:28px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:24px;}
  .field label{display:block; font-size:12px; color:var(--ink-soft); margin-bottom:6px;}
  .field input{width:100%; padding:11px 13px; border-radius:8px; border:1px solid var(--line); background:#1a1a1a; color:#fff; font-size:15px; margin-bottom:14px;}
  .btn{display:inline-flex; align-items:center; justify-content:center; background:var(--red); color:#fff; border:none; border-radius:8px; padding:12px 20px; font-size:14px; font-weight:700; cursor:pointer; width:100%;}
  .btn:hover{background:#b8080f;}
  .courseCard{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:14px; cursor:pointer; transition:border-color .2s;}
  .courseCard:hover{border-color:var(--red);}
  .courseCard h3{font-size:16px; margin-bottom:4px;}
  .courseCard p{color:var(--ink-soft); font-size:12.5px;}
  .moduleBlock{margin-bottom:22px;}
  .moduleBlock h3{font-size:14px; color:var(--red); text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px;}
  .lesson{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:10px;}
  .lesson h4{font-size:14.5px; margin-bottom:8px;}
  .lesson p{font-size:13.5px; color:#ddd; line-height:1.7;}
  .lesson a{display:inline-block; margin-top:10px; color:var(--red); font-size:12.5px; text-decoration:none; font-weight:700;}
  .backLink{display:inline-block; margin-bottom:20px; color:var(--ink-soft); font-size:12.5px; text-decoration:none; cursor:pointer;}
  .backLink:hover{color:var(--ink);}
  .empty{color:var(--ink-soft); font-size:13px; text-align:center; padding:40px 0;}
  .langSwitch{display:flex; gap:2px; background:rgba(255,255,255,0.06); border-radius:6px; padding:3px; width:max-content; margin-left:auto; margin-bottom:14px;}
  .langSwitch button{background:transparent; border:none; color:var(--ink-soft); font-size:11px; font-weight:700; padding:7px 11px; min-height:34px; border-radius:4px; cursor:pointer; font-family:inherit;}
  .langSwitch button.active{background:var(--red); color:#fff;}
  .errorMsg{color:#ff6b6b; font-size:12.5px; margin-top:-6px; margin-bottom:14px; display:none;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="langSwitch"><button class="langBtn active" data-lang="el" type="button">ΕΛ</button><button class="langBtn" data-lang="en" type="button">EN</button></div>
    <h1 id="hTitle">📚 Τα Μαθήματά μου</h1>
    <p class="sub" id="hSub">Happy Fit Physio · εκπαιδευτικά μαθήματα</p>

    <div id="emailView" class="card">
      <div class="field">
        <label id="emailLbl">Email που χρησιμοποίησες στην αγορά</label>
        <input type="email" id="emailInput" placeholder="you@example.com" required>
      </div>
      <div class="errorMsg" id="errorMsg"></div>
      <button class="btn" id="unlockBtn" type="button">Δες τα μαθήματά μου →</button>
    </div>

    <div id="listView" style="display:none;"></div>
    <div id="courseView" style="display:none;"></div>
  </div>

<script type="module">
  import { createClient } from './supabase.js';
  const supabase = createClient(
    'https://hxbpuamzisdldwbuumda.supabase.co',
    'sb_publishable_R0pcwjFyKcm-PPIkdm_wkw_7tgXtYoH'
  );

  const emailView = document.getElementById('emailView');
  const listView = document.getElementById('listView');
  const courseView = document.getElementById('courseView');
  const errorMsg = document.getElementById('errorMsg');

  const I18N = {
    el:{ title:'Τα Μαθήματά μου', sub:'Happy Fit Physio · εκπαιδευτικά μαθήματα', emailLabel:'Email που χρησιμοποίησες στην αγορά', unlock:'Δες τα μαθήματά μου →', checking:'Έλεγχος…',
      notFound:'Δεν βρέθηκε αγορά με αυτό το email. Έλεγξε το email ή επικοινώνησε μαζί μας.', changeEmail:'← Αλλαγή email', loading:'Φόρτωση…', back:'← Πίσω',
      noContent:'Δεν βρέθηκε ακόμα περιεχόμενο για αυτό το μάθημα.', explain:'Σου το εξηγώ ο ίδιος →', done:'Ολοκληρώθηκε' },
    en:{ title:'My Courses', sub:'Happy Fit Physio · educational courses', emailLabel:'Email you used for the purchase', unlock:'See my courses →', checking:'Checking…',
      notFound:'No purchase was found with this email. Check the email or contact us.', changeEmail:'← Change email', loading:'Loading…', back:'← Back',
      noContent:'No content has been added for this course yet.', explain:'I explain it myself →', done:'Completed' }
  };
  let LANG = 'el';
  try{ const l = localStorage.getItem('hfp_lang'); LANG = (l==='en'||l==='el') ? l : (/^el\b/i.test(navigator.language||'el') ? 'el' : 'en'); }catch(e){}
  const tr = k => I18N[LANG][k];
  function applyStatic(){
    document.documentElement.lang = LANG;
    document.title = tr('title') + ' · Happy Fit Physio';
    document.getElementById('hTitle').textContent = '📚 ' + tr('title');
    document.getElementById('hSub').textContent = tr('sub');
    document.getElementById('emailLbl').textContent = tr('emailLabel');
    document.getElementById('unlockBtn').textContent = tr('unlock');
    document.querySelectorAll('.langBtn').forEach(b=>b.classList.toggle('active', b.dataset.lang===LANG));
  }
  document.querySelectorAll('.langBtn').forEach(b=>b.addEventListener('click', ()=>{ LANG = b.dataset.lang; try{ localStorage.setItem('hfp_lang', LANG); }catch(e){} applyStatic(); }));
  let currentEmail = '';
  // Everything that comes from the database is escaped before it goes into the page, and links must be https.
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const safeUrl = u => /^https:\/\//i.test(String(u || '').trim()) ? String(u).trim() : '';

  applyStatic();
  document.getElementById('unlockBtn').addEventListener('click', unlock);
  document.getElementById('emailInput').addEventListener('keydown', e => { if(e.key==='Enter') unlock(); });

  async function unlock(){
    const email = document.getElementById('emailInput').value.trim();
    errorMsg.style.display = 'none';
    if(!email) return;
    const btn = document.getElementById('unlockBtn');
    btn.disabled = true; btn.textContent = tr('checking');
    const { data, error } = await supabase.rpc('list_my_enrollments', { p_email: email });
    btn.disabled = false; btn.textContent = tr('unlock');
    if(error || !data || !data.length){
      errorMsg.textContent = tr('notFound');
      errorMsg.style.display = 'block';
      return;
    }
    currentEmail = email;
    emailView.style.display = 'none';
    renderList(data);
  }

  function renderList(courses){
    listView.style.display = 'block';
    listView.innerHTML = `<a class="backLink" id="logoutLink">${tr('changeEmail')}</a>` + courses.map(c => `
      <div class="courseCard" data-id="${esc(c.course_id)}">
        <h3>${esc(c.title)}</h3>
        <p>${esc(c.subtitle || '')}</p>
      </div>`).join('');
    listView.querySelectorAll('.courseCard').forEach(el => el.addEventListener('click', () => openCourse(el.dataset.id, el.querySelector('h3').textContent)));
    document.getElementById('logoutLink').addEventListener('click', () => {
      listView.style.display = 'none'; emailView.style.display = 'block';
    });
  }

  async function openCourse(courseId, title){
    listView.style.display = 'none';
    courseView.style.display = 'block';
    courseView.innerHTML = `<p class="empty">${tr('loading')}</p>`;
    const { data, error } = await supabase.rpc('get_course_content', { p_email: currentEmail, p_course_id: courseId });
    if(error || !data || !data.length){
      courseView.innerHTML = `<a class="backLink" id="backLink">${tr('back')}</a><p class="empty">${tr('noContent')}</p>`;
      document.getElementById('backLink').addEventListener('click', backToList);
      return;
    }
    const modules = {};
    data.forEach(row => {
      if(!modules[row.module_title]) modules[row.module_title] = [];
      modules[row.module_title].push(row);
    });
    let html = `<a class="backLink" id="backLink">${tr('back')}</a><h1 style="font-size:20px; margin-bottom:20px;">${esc(title)}</h1>`;
    Object.entries(modules).forEach(([modTitle, lessons]) => {
      html += `<div class="moduleBlock"><h3>${esc(modTitle)}</h3>`;
      lessons.forEach(l => {
        html += `<div class="lesson" data-lesson="${encodeURIComponent(l.lesson_title)}"><h4>${esc(l.lesson_title)}</h4><p>${esc(l.lesson_content||'').replace(/\n/g,'<br>')}</p>${safeUrl(l.video_url) ? `<a href="${esc(safeUrl(l.video_url))}" target="_blank" rel="noopener noreferrer">🎥 ${tr('explain')}</a>` : ''}<div style="margin-top:10px;"><label style="display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--red); cursor:pointer;"><input type="checkbox" class="lessonDoneCheck" data-course="${esc(courseId)}" data-title="${esc(l.lesson_title)}"> ✓ ${tr('done')}</label></div></div>`;
      });
      html += `</div>`;
    });
    courseView.innerHTML = html;
    document.getElementById('backLink').addEventListener('click', backToList);

    const { data: doneRows } = await supabase.from('lesson_progress').select('lesson_title').eq('email', currentEmail).eq('course_id', courseId);
    const doneSet = new Set((doneRows||[]).map(r=>r.lesson_title));
    courseView.querySelectorAll('.lessonDoneCheck').forEach(cb => {
      if(doneSet.has(cb.dataset.title)) cb.checked = true;
      cb.addEventListener('change', async () => {
        if(cb.checked){
          await supabase.from('lesson_progress').upsert({ email: currentEmail, course_id: cb.dataset.course, lesson_title: cb.dataset.title }, { onConflict: 'email,course_id,lesson_title' });
        } else {
          await supabase.from('lesson_progress').delete().eq('email', currentEmail).eq('course_id', cb.dataset.course).eq('lesson_title', cb.dataset.title);
        }
      });
    });
  }

  async function backToList(){
    courseView.style.display = 'none';
    const { data } = await supabase.rpc('list_my_enrollments', { p_email: currentEmail });
    renderList(data || []);
    listView.style.display = 'block';
  }
</script>
</body>
</html>
